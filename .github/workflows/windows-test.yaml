name: Windows compatibility test

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
    workflow_dispatch:

permissions:
    contents: read

env:
    CARGO_TERM_COLOR: always

jobs:
    compatibility-test:
        name: Native Windows compatibility test
        runs-on: windows-latest
        timeout-minutes: 30

        steps:
            - uses: actions/checkout@v5

            - uses: actions-rust-lang/setup-rust-toolchain@v1
              with:
                  toolchain: "1.95"

            - name: Build Windows executable
              run: >-
                  cargo build
                  --package trustworthiness_checker
                  --bin trustworthiness_checker
                  --no-default-features

            - name: Run finite monitoring test
              shell: pwsh
              run: |
                  $ErrorActionPreference = "Stop"

                  $output = @(
                    & .\target\debug\trustworthiness_checker.exe `
                      tests/fixtures/simple_add_typed.dsrv `
                      --input-file tests/fixtures/simple_add_typed.input `
                      --output-stdout
                  )

                  if ($LASTEXITCODE -ne 0) {
                    throw "Windows compatibility test exited with code $LASTEXITCODE"
                  }

                  $output | ForEach-Object { Write-Host $_ }

                  $expected = @(
                    "z[0] = Int(3)"
                    "z[1] = Int(7)"
                    "z[2] = Int(11)"
                  )

                  foreach ($line in $expected) {
                    if ($line -notin $output) {
                      throw "Missing expected output: $line"
                    }
                  }
