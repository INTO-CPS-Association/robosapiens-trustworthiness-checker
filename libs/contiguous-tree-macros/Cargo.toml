[package]
name = "contiguous-tree-macros"
version = "0.1.0"
edition = "2024"
license-file = "../../LICENSE.md"

[lib]
proc-macro = true

[features]
default = []
serde = []

[dependencies]
proc-macro-crate = "3.5.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.4", features = ["full"] }

[dev-dependencies]
renamed-contiguous-tree = { package = "contiguous-tree", path = "../contiguous-tree" }
trybuild = "1"
