[package]
name = "tc-testutils"
version = "0.1.0"
edition = "2024"
license-file = "../../LICENSE.md"

[lib]
name = "tc_testutils"
path = "src/lib.rs"
bench = false

[features]
testcontainers = [
    "testcontainers-modules",
    "async-compat",
    "dep:redis",
    "dep:redis-macros",
]
ros = ["r2r"]

[dependencies]
testcontainers-modules = { version = "0.15.0", optional = true, features = [
    "mosquitto",
    "redis",
] }
test-log = { version = "0.2.21", features = ["trace"] }
async-compat = {version = "0.2.5", optional = true}
tracing = { version = "0.1.44", features = [
    "attributes",
    "std",
    "tracing-attributes",
    "async-await",
    "release_max_level_warn",
] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
trustworthiness_checker = { path = "../../", default-features = false }
futures = "0.3.34"
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive", "rc"] }
# mqtt client
# Disable the default dependency on SSL to avoid a build dependency on OpenSSL
paho-mqtt = { version = "0.14.0", default-features = false, features = [
    "bundled",
    "ssl",
] }
redis = { version = "1.6.0", optional = true, features = ["smol-comp"] }
redis-macros = { version = "1.0.1", optional = true }
anyhow = { version = "1.0.104", features = ["backtrace"] }
# unsync = "0.1.2"
smol = "2.0.2"
async-unsync = "0.3.0"
async-stream = "0.3.6"
unsync = "0.2.0"
macro_rules_attribute = "0.2.3"
smol-macros = "0.1.1"
futures-timeout = "0.2.1"
r2r = { version = "0.9.5", optional = true }
