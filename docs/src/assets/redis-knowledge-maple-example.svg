<svg class="tc-figure" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 390" role="img" aria-labelledby="redis-maple-title redis-maple-desc">
  <title id="redis-maple-title">Representative MAPLE-K Redis input example</title>
  <desc id="redis-maple-desc">Analyse completion and Legitimate completion enter through Redis Pub/Sub events, while the current selected plan enters through a Redis Knowledge key. All three feed the Trustworthiness Checker.</desc>
  <!--
    Theme tokens. In the book these are overridden per theme by theme/diagram-theme.css; this block
    is the fallback that keeps the figure readable standalone, as an image, and when rustdoc inlines
    it with include_str!. Scoped to .tc-figure, never :root, so inlining cannot leak the names.
  -->
  <style>
    .tc-figure {
      --fig-bg: #ffffff;
      --fig-edge: #d0d7de;
      --fig-ink: #17212b;
      --fig-ink-2: #52606d;
      --fig-line: #65758b;
      --fig-panel: #f7f9fb;
      --fig-panel-line: #a8b3bf;
      --fig-blue: #e8f1fb;
      --fig-blue-line: #2563a6;
      --fig-green: #e6f5f0;
      --fig-green-line: #147d64;
      --fig-orange: #fff1e6;
      --fig-orange-line: #b54708;
      --fig-purple: #f3ebf8;
      --fig-purple-line: #8055a3;
      --fig-source: #eef6ff;
      --fig-source-line: #3478b8;
      --fig-redis: #fff5e8;
      --fig-redis-line: #bc6b16;
      --fig-checker: #f1ecff;
      --fig-checker-line: #7254b3;
      --fig-knowledge: #eaf8ee;
      --fig-knowledge-line: #39834d;
    }
    @media (prefers-color-scheme: dark) {
      .tc-figure {
        --fig-bg: #171b26;
        --fig-edge: #333a4d;
        --fig-ink: #e6e9f0;
        --fig-ink-2: #a2acbd;
        --fig-line: #8492a6;
        --fig-panel: #1e2432;
        --fig-panel-line: #3d465c;
        --fig-blue: #16283d;
        --fig-blue-line: #6aa9e0;
        --fig-green: #123029;
        --fig-green-line: #4fbfa0;
        --fig-orange: #33240f;
        --fig-orange-line: #e0a44e;
        --fig-purple: #241c33;
        --fig-purple-line: #b18fd4;
        --fig-source: #14283c;
        --fig-source-line: #6fa8db;
        --fig-redis: #33260f;
        --fig-redis-line: #d99a3f;
        --fig-checker: #241d34;
        --fig-checker-line: #a892d6;
        --fig-knowledge: #132c1c;
        --fig-knowledge-line: #5fae74;
      }
    }
  </style>
  <defs>
    <marker id="redis-maple-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="var(--fig-ink-2)"/>
    </marker>
    <style>
      .phase { fill: var(--fig-source); stroke: var(--fig-source-line); }
      .event { fill: var(--fig-redis); stroke: var(--fig-redis-line); }
      .knowledge { fill: var(--fig-knowledge); stroke: var(--fig-knowledge-line); }
      .checker { fill: var(--fig-checker); stroke: var(--fig-checker-line); }
      .box { stroke-width: 2; rx: 10; }
      .line { fill: none; stroke: var(--fig-ink-2); stroke-width: 2.5; marker-end: url(#redis-maple-arrow); }
      .label { fill: var(--fig-ink); font: 17px sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .small { fill: var(--fig-ink); font: 14px sans-serif; text-anchor: middle; }
    </style>
  </defs>
  <rect class="box phase" x="25" y="30" width="220" height="72"/>
  <text class="label" x="135" y="66">Analyse completed</text>
  <rect class="box knowledge" x="25" y="159" width="220" height="72"/>
  <text class="label" x="135" y="195">Current selected plan</text>
  <rect class="box phase" x="25" y="288" width="220" height="72"/>
  <text class="label" x="135" y="324">Legitimate completed</text>
  <rect class="box event" x="330" y="30" width="220" height="72"/>
  <text class="label" x="440" y="57">Redis Pub/Sub</text>
  <text class="small" x="440" y="82">event</text>
  <rect class="box knowledge" x="330" y="159" width="220" height="72"/>
  <text class="label" x="440" y="186">Redis Knowledge</text>
  <text class="small" x="440" y="211">key</text>
  <rect class="box event" x="330" y="288" width="220" height="72"/>
  <text class="label" x="440" y="315">Redis Pub/Sub</text>
  <text class="small" x="440" y="340">event</text>
  <rect class="box checker" x="690" y="130" width="220" height="130"/>
  <text class="label" x="800" y="182">Trustworthiness</text>
  <text class="label" x="800" y="210">Checker</text>
  <path class="line" d="M245 66 H330"/>
  <path class="line" d="M245 195 H330"/>
  <path class="line" d="M245 324 H330"/>
  <path class="line" d="M550 66 H610 Q635 66 655 105 L690 159"/>
  <path class="line" d="M550 195 H690"/>
  <path class="line" d="M550 324 H610 Q635 324 655 285 L690 231"/>
</svg>
