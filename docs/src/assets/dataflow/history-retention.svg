<svg class="tc-figure" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" role="img" aria-labelledby="history-retention-title history-retention-desc" style="width:100%;max-width:1080px;height:auto;background:var(--fig-bg);border:1px solid var(--fig-edge);border-radius:6px">
<title id="history-retention-title">Temporal state ownership and common commit</title>
<desc id="history-retention-desc">Three panels distinguish delay storage. A direct top-level delay of an external environment variable reads monitor HistoryStore through HistoryAccess; its local delay commit is a no-op. A runtime-defined or internal delay owns an evaluator-local DelayState ring. A recursive self-delay also owns a local DelayState ring and stages the completed enclosing output. Positive delays return Deferred until their storage contains enough committed samples. All successful current-row samples become historical only at the common post-row commit.</desc>
  <!--
    Theme tokens. In the book these are overridden per theme by theme/diagram-theme.css; this block
    is the fallback that keeps the figure readable standalone, as an image, and when rustdoc inlines
    it with include_str!. Scoped to .tc-figure, never :root, so inlining cannot leak the names.
  -->
  <style>
    .tc-figure {
      --fig-bg: #ffffff;
      --fig-edge: #d0d7de;
      --fig-ink: #17212b;
      --fig-ink-2: #52606d;
      --fig-line: #65758b;
      --fig-panel: #f7f9fb;
      --fig-panel-line: #a8b3bf;
      --fig-blue: #e8f1fb;
      --fig-blue-line: #2563a6;
      --fig-green: #e6f5f0;
      --fig-green-line: #147d64;
      --fig-orange: #fff1e6;
      --fig-orange-line: #b54708;
      --fig-purple: #f3ebf8;
      --fig-purple-line: #8055a3;
      --fig-source: #eef6ff;
      --fig-source-line: #3478b8;
      --fig-redis: #fff5e8;
      --fig-redis-line: #bc6b16;
      --fig-checker: #f1ecff;
      --fig-checker-line: #7254b3;
      --fig-knowledge: #eaf8ee;
      --fig-knowledge-line: #39834d;
    }
    @media (prefers-color-scheme: dark) {
      .tc-figure {
        --fig-bg: #171b26;
        --fig-edge: #333a4d;
        --fig-ink: #e6e9f0;
        --fig-ink-2: #a2acbd;
        --fig-line: #8492a6;
        --fig-panel: #1e2432;
        --fig-panel-line: #3d465c;
        --fig-blue: #16283d;
        --fig-blue-line: #6aa9e0;
        --fig-green: #123029;
        --fig-green-line: #4fbfa0;
        --fig-orange: #33240f;
        --fig-orange-line: #e0a44e;
        --fig-purple: #241c33;
        --fig-purple-line: #b18fd4;
        --fig-source: #14283c;
        --fig-source-line: #6fa8db;
        --fig-redis: #33260f;
        --fig-redis-line: #d99a3f;
        --fig-checker: #241d34;
        --fig-checker-line: #a892d6;
        --fig-knowledge: #132c1c;
        --fig-knowledge-line: #5fae74;
      }
    }
  </style>
<defs>
<marker id="history-retention-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M 0 0 L 10 5 L 0 10 z" fill="var(--fig-line)"/>
</marker>
</defs>
<rect x="1" y="1" width="1078" height="618" rx="6" fill="var(--fig-bg)"/>
<text x="24" y="30" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="var(--fig-ink)">Historical reads have two storage owners and one visibility boundary</text>
<text x="25" y="62" font-family="system-ui, sans-serif" font-size="12" fill="var(--fig-ink-2)">During tick n, every positive delay reads state committed through n − 1; an unfilled read yields Value::Deferred.</text>
<g font-family="system-ui, sans-serif">
<rect x="25" y="86" width="330" height="360" rx="7" fill="var(--fig-panel)" stroke="var(--fig-panel-line)"/>
<text x="45" y="116" font-size="14" font-weight="600" fill="var(--fig-ink)">1. Direct top-level external delay</text>
<text x="45" y="138" font-family="ui-monospace, monospace" font-size="12" fill="var(--fig-ink-2)">total = default(total[1], 0) + scaled</text>
<rect x="55" y="165" width="270" height="58" rx="5" fill="var(--fig-blue)" stroke="var(--fig-blue-line)" stroke-width="1.5"/>
<text x="190" y="190" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="var(--fig-ink)">HistoryStore(total)</text>
<text x="190" y="209" text-anchor="middle" font-size="11" fill="var(--fig-ink-2)">monitor-owned bounded history</text>
<rect x="55" y="260" width="270" height="64" rx="5" fill="var(--fig-orange)" stroke="var(--fig-orange-line)" stroke-width="1.5"/>
<text x="190" y="286" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="var(--fig-ink)">Delay via HistoryAccess</text>
<text x="190" y="305" text-anchor="middle" font-size="11" fill="var(--fig-ink-2)">read committed sample or Deferred</text>
<path d="M 190 223 V 260" fill="none" stroke="var(--fig-line)" stroke-width="1.8" marker-end="url(#history-retention-arrow)"/>
<rect x="55" y="360" width="270" height="58" rx="5" fill="var(--fig-panel)" stroke="var(--fig-panel-line)" stroke-width="1.5"/>
<text x="190" y="385" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="var(--fig-ink)">local DelayState commit</text>
<text x="190" y="404" text-anchor="middle" font-size="11" fill="var(--fig-ink-2)">no-op for shared external history</text>
<rect x="375" y="86" width="330" height="360" rx="7" fill="var(--fig-panel)" stroke="var(--fig-panel-line)"/>
<text x="395" y="116" font-size="14" font-weight="600" fill="var(--fig-ink)">2. Internal or runtime-defined delay</text>
<text x="395" y="138" font-family="ui-monospace, monospace" font-size="12" fill="var(--fig-ink-2)">dynamic or function body, internal graph</text>
<rect x="405" y="165" width="270" height="58" rx="5" fill="var(--fig-blue)" stroke="var(--fig-blue-line)" stroke-width="1.5"/>
<text x="540" y="190" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="var(--fig-ink)">NodeState::Delay</text>
<text x="540" y="209" text-anchor="middle" font-size="11" fill="var(--fig-ink-2)">evaluator-local DelayState ring</text>
<rect x="405" y="260" width="270" height="64" rx="5" fill="var(--fig-orange)" stroke="var(--fig-orange-line)" stroke-width="1.5"/>
<text x="540" y="286" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="var(--fig-ink)">Delay</text>
<text x="540" y="305" text-anchor="middle" font-size="11" fill="var(--fig-ink-2)">read ring; stage current operand</text>
<path d="M 540 223 V 260" fill="none" stroke="var(--fig-line)" stroke-width="1.8" marker-end="url(#history-retention-arrow)"/>
<rect x="405" y="360" width="270" height="58" rx="5" fill="var(--fig-green)" stroke="var(--fig-green-line)" stroke-width="1.5"/>
<text x="540" y="385" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="var(--fig-ink)">pending operand from row n</text>
<text x="540" y="404" text-anchor="middle" font-size="11" fill="var(--fig-ink-2)">push only after row succeeds</text>
<path d="M 540 324 V 360" fill="none" stroke="var(--fig-line)" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#history-retention-arrow)"/>
<rect x="725" y="86" width="330" height="360" rx="7" fill="var(--fig-panel)" stroke="var(--fig-panel-line)"/>
<text x="745" y="116" font-size="14" font-weight="600" fill="var(--fig-ink)">3. Recursive self-delay</text>
<text x="745" y="138" font-family="ui-monospace, monospace" font-size="12" fill="var(--fig-ink-2)">previous enclosing stream output</text>
<rect x="755" y="165" width="270" height="58" rx="5" fill="var(--fig-blue)" stroke="var(--fig-blue-line)" stroke-width="1.5"/>
<text x="890" y="190" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="var(--fig-ink)">NodeState::Delay</text>
<text x="890" y="209" text-anchor="middle" font-size="11" fill="var(--fig-ink-2)">evaluator-local DelayState ring</text>
<rect x="755" y="260" width="270" height="64" rx="5" fill="var(--fig-purple)" stroke="var(--fig-purple-line)" stroke-width="1.5"/>
<text x="890" y="286" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="var(--fig-ink)">RecursiveDelay</text>
<text x="890" y="305" text-anchor="middle" font-size="11" fill="var(--fig-ink-2)">read previous output or Deferred</text>
<path d="M 890 223 V 260" fill="none" stroke="var(--fig-line)" stroke-width="1.8" marker-end="url(#history-retention-arrow)"/>
<rect x="755" y="360" width="270" height="58" rx="5" fill="var(--fig-green)" stroke="var(--fig-green-line)" stroke-width="1.5"/>
<text x="890" y="385" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="var(--fig-ink)">pending stream output n</text>
<text x="890" y="404" text-anchor="middle" font-size="11" fill="var(--fig-ink-2)">stage after enclosing output exists</text>
<path d="M 890 324 V 360" fill="none" stroke="var(--fig-line)" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#history-retention-arrow)"/>
</g>
<line x1="25" y1="474" x2="1055" y2="474" stroke="var(--fig-panel-line)"/>
<rect x="80" y="505" width="920" height="78" rx="7" fill="var(--fig-green)" stroke="var(--fig-green-line)" stroke-width="1.5"/>
<text x="540" y="535" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="600" fill="var(--fig-ink)">successful post-row temporal commit</text>
<text x="540" y="558" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="var(--fig-ink-2)">HistoryStore records completed monitor values; local DelayState rings push staged samples. Both become readable at tick n + 1.</text>
<path d="M 190 418 C 190 480 270 480 330 505" fill="none" stroke="var(--fig-line)" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#history-retention-arrow)"/>
<path d="M 540 418 V 505" fill="none" stroke="var(--fig-line)" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#history-retention-arrow)"/>
<path d="M 890 418 C 890 480 810 480 750 505" fill="none" stroke="var(--fig-line)" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#history-retention-arrow)"/>
</svg>
