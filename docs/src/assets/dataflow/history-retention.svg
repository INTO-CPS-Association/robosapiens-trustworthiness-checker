<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 355" role="img" aria-labelledby="history-arrow-title history-arrow-desc" style="width:100%;max-width:960px;height:auto;background:#ffffff;border:1px solid #d0d7de;border-radius:6px">
<title id="history-arrow-title">Two-phase bounded history retention</title>
<desc id="history-arrow-desc">During evaluation, ordinary Delay nodes read their rings and stage current operands, while RecursiveDelay nodes read retained outputs and stage completed stream outputs. Only after the row succeeds does the monitor commit staged writes. Dynamic history belongs to the installed StreamEvaluator.</desc>
<defs>
  <marker id="history-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#65758b"/>
  </marker>
</defs>
<text x="24" y="27" text-anchor="start" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#17212b">History has a read/stage phase and a post-row commit</text>
<text x="35" y="62" text-anchor="start" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#17212b">Evaluate / read-stage</text>
<rect x="35" y="82" width="250" height="64" rx="5" fill="#fff1e6" stroke="#b54708" stroke-width="1.5"/>
<text x="160" y="112" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">Delay x[3]</text>
<text x="160" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">read oldest 10; stage operand x=40</text>
<rect x="355" y="82" width="250" height="64" rx="5" fill="#f3ebf8" stroke="#8055a3" stroke-width="1.5"/>
<text x="480" y="112" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">RecursiveDelay total[1]</text>
<text x="480" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">read prior output; stage new output</text>
<rect x="675" y="82" width="250" height="64" rx="5" fill="#e8f1fb" stroke="#2563a6" stroke-width="1.5"/>
<text x="800" y="112" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">StreamEvaluator result</text>
<text x="800" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">write completed environment row</text>
<line x1="285" y1="114" x2="355" y2="114" stroke="#65758b" stroke-width="1.8" marker-end="url(#history-arrow)"/>
<line x1="605" y1="114" x2="675" y2="114" stroke="#65758b" stroke-width="1.8" marker-end="url(#history-arrow)"/>
<line x1="25" y1="178" x2="935" y2="178" stroke="#a8b3bf" stroke-width="1"/>
<text x="35" y="210" text-anchor="start" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#17212b">Post-row temporal commit</text>
<rect x="35" y="230" width="250" height="64" rx="5" fill="#fff1e6" stroke="#b54708" stroke-width="1.5"/>
<text x="160" y="260" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">DelayState</text>
<text x="160" y="278" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">push staged x=40; capacity stays 3</text>
<rect x="355" y="230" width="250" height="64" rx="5" fill="#f3ebf8" stroke="#8055a3" stroke-width="1.5"/>
<text x="480" y="260" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">RecursiveDelay history</text>
<text x="480" y="278" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">commit staged stream output</text>
<rect x="675" y="230" width="250" height="64" rx="5" fill="#e6f5f0" stroke="#147d64" stroke-width="1.5"/>
<text x="800" y="260" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">Dynamic evaluator state</text>
<text x="800" y="278" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">committed only while installed</text>
<text x="480" y="330" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">If evaluation fails, commit is skipped; retained history is unchanged</text>
</svg>
