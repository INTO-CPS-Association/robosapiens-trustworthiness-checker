<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 525" role="img" aria-labelledby="history-arrow-title history-arrow-desc" style="width:100%;max-width:960px;height:auto;background:#ffffff;border:1px solid #d0d7de;border-radius:6px">
<title id="history-arrow-title">Temporal delay staging and commit</title>
<desc id="history-arrow-desc">During tick n, an ordinary Delay and a RecursiveDelay each read only their own ring committed through tick n minus one. The recursive delay supplies a previous stream output to the stream body; after the body combines it with current operands, the completed stream output is staged for that same self-delay. The ordinary delay captures its operand from the completed row. The temporal commit pushes both staged samples into their respective rings, where they become readable at tick n plus one.</desc>
<defs>
  <marker id="history-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#65758b"/>
  </marker>
</defs>
<text x="24" y="27" text-anchor="start" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#17212b">Read old state; commit new samples</text>
<rect x="25" y="48" width="440" height="350" rx="7" fill="#f7f9fb" stroke="#a8b3bf"/>
<rect x="495" y="48" width="440" height="350" rx="7" fill="#f7f9fb" stroke="#a8b3bf"/>
<text x="45" y="76" text-anchor="start" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#17212b">ordinary delay</text>
<text x="515" y="76" text-anchor="start" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#17212b">recursive self-delay</text>
<rect x="55" y="95" width="170" height="58" rx="5" fill="#e8f1fb" stroke="#2563a6" stroke-width="1.5"/>
<text x="140" y="122" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">ring through n - 1</text>
<text x="140" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">committed history</text>
<rect x="265" y="95" width="170" height="58" rx="5" fill="#fff1e6" stroke="#b54708" stroke-width="1.5"/>
<text x="350" y="122" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">Delay</text>
<text x="350" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">read; mark pending</text>
<line x1="225" y1="124" x2="265" y2="124" stroke="#65758b" stroke-width="1.8" marker-end="url(#history-arrow)"/>
<rect x="55" y="270" width="170" height="58" rx="5" fill="#e6f5f0" stroke="#147d64" stroke-width="1.5"/>
<text x="140" y="297" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">row operand n</text>
<text x="140" y="315" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">completed row</text>
<rect x="265" y="270" width="170" height="58" rx="5" fill="#fff1e6" stroke="#b54708" stroke-width="1.5"/>
<text x="350" y="297" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">ordinary capture</text>
<text x="350" y="315" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">sample for this delay</text>
<line x1="225" y1="299" x2="265" y2="299" stroke="#65758b" stroke-width="1.8" marker-end="url(#history-arrow)"/>
<line x1="350" y1="153" x2="350" y2="270" stroke="#65758b" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#history-arrow)"/>
<text x="362" y="218" text-anchor="start" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">pending</text>
<rect x="525" y="95" width="170" height="58" rx="5" fill="#e8f1fb" stroke="#2563a6" stroke-width="1.5"/>
<text x="610" y="122" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">ring through n - 1</text>
<text x="610" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">committed history</text>
<rect x="735" y="95" width="170" height="58" rx="5" fill="#f3ebf8" stroke="#8055a3" stroke-width="1.5"/>
<text x="820" y="122" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">RecursiveDelay</text>
<text x="820" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">previous output</text>
<line x1="695" y1="124" x2="735" y2="124" stroke="#65758b" stroke-width="1.8" marker-end="url(#history-arrow)"/>
<rect x="525" y="190" width="170" height="58" rx="5" fill="#e6f5f0" stroke="#147d64" stroke-width="1.5"/>
<text x="610" y="224" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">current operands n</text>
<rect x="735" y="190" width="170" height="58" rx="5" fill="#e6f5f0" stroke="#147d64" stroke-width="1.5"/>
<text x="820" y="217" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">stream body</text>
<text x="820" y="235" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">combine current + previous</text>
<line x1="695" y1="219" x2="735" y2="219" stroke="#65758b" stroke-width="1.8" marker-end="url(#history-arrow)"/>
<line x1="820" y1="153" x2="820" y2="190" stroke="#65758b" stroke-width="1.8" marker-end="url(#history-arrow)"/>
<rect x="735" y="285" width="170" height="58" rx="5" fill="#f3ebf8" stroke="#8055a3" stroke-width="1.5"/>
<text x="820" y="312" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">stream output n</text>
<text x="820" y="330" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">stage for self-delay</text>
<line x1="820" y1="248" x2="820" y2="285" stroke="#65758b" stroke-width="1.8" marker-end="url(#history-arrow)"/>
<line x1="25" y1="420" x2="935" y2="420" stroke="#a8b3bf" stroke-width="1"/>
<text x="35" y="448" text-anchor="start" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#17212b">after row n completes</text>
<rect x="350" y="445" width="210" height="60" rx="5" fill="#e6f5f0" stroke="#147d64" stroke-width="1.5"/>
<text x="455" y="473" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">temporal commit</text>
<text x="455" y="491" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">push staged samples</text>
<line x1="350" y1="328" x2="415" y2="445" stroke="#65758b" stroke-width="1.8" marker-end="url(#history-arrow)"/>
<line x1="820" y1="343" x2="505" y2="445" stroke="#65758b" stroke-width="1.8" marker-end="url(#history-arrow)"/>
<rect x="650" y="445" width="255" height="60" rx="5" fill="#e8f1fb" stroke="#2563a6" stroke-width="1.5"/>
<text x="777" y="473" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">rings through n</text>
<text x="777" y="491" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">readable at tick n + 1</text>
<line x1="560" y1="475" x2="650" y2="475" stroke="#65758b" stroke-width="1.8" marker-end="url(#history-arrow)"/>
</svg>
