<svg class="tc-figure" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 375" role="img" aria-labelledby="environment-arrow-title environment-arrow-desc" style="width:100%;max-width:960px;height:auto;background:var(--fig-bg);border:1px solid var(--fig-edge);border-radius:6px">
<title id="environment-arrow-title">Stable environment slots and output projection</title>
<desc id="environment-arrow-desc">Input and computed values occupy stable EnvironmentSlot indices. The scheduler may change stream evaluation order without moving evaluator state, while the declared output order alert, scaled, total projects slots three, one, and two.</desc>
  <!--
    Theme tokens. In the book these are overridden per theme by theme/diagram-theme.css; this block
    is the fallback that keeps the figure readable standalone, as an image, and when rustdoc inlines
    it with include_str!. Scoped to .tc-figure, never :root, so inlining cannot leak the names.
  -->
  <style>
    .tc-figure {
      --fig-bg: var(--fig-bg); --fig-edge: var(--fig-edge);
      --fig-ink: var(--fig-ink); --fig-ink-2: var(--fig-ink-2); --fig-line: var(--fig-line);
      --fig-panel: var(--fig-panel); --fig-panel-line: var(--fig-panel-line);
      --fig-blue: var(--fig-blue); --fig-blue-line: var(--fig-blue-line);
      --fig-green: var(--fig-green); --fig-green-line: var(--fig-green-line);
      --fig-orange: var(--fig-orange); --fig-orange-line: var(--fig-orange-line);
      --fig-purple: var(--fig-purple); --fig-purple-line: var(--fig-purple-line);
      --fig-source: var(--fig-source); --fig-source-line: var(--fig-source-line);
      --fig-redis: var(--fig-redis); --fig-redis-line: var(--fig-redis-line);
      --fig-checker: var(--fig-checker); --fig-checker-line: var(--fig-checker-line);
      --fig-knowledge: var(--fig-knowledge); --fig-knowledge-line: var(--fig-knowledge-line);
    }
    @media (prefers-color-scheme: dark) {
      .tc-figure {
        --fig-bg: #171b26; --fig-edge: #333a4d;
        --fig-ink: #e6e9f0; --fig-ink-2: #a2acbd; --fig-line: #8492a6;
        --fig-panel: #1e2432; --fig-panel-line: #3d465c;
        --fig-blue: #16283d; --fig-blue-line: #6aa9e0;
        --fig-green: #123029; --fig-green-line: #4fbfa0;
        --fig-orange: #33240f; --fig-orange-line: #e0a44e;
        --fig-purple: #241c33; --fig-purple-line: #b18fd4;
        --fig-source: #14283c; --fig-source-line: #6fa8db;
        --fig-redis: #33260f; --fig-redis-line: #d99a3f;
        --fig-checker: #241d34; --fig-checker-line: #a892d6;
        --fig-knowledge: #132c1c; --fig-knowledge-line: #5fae74;
      }
    }
  </style>
<defs>
  <marker id="environment-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--fig-line)"/>
  </marker>
</defs>
<text x="24" y="27" text-anchor="start" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="var(--fig-ink)">Stable EnvironmentSlot layout (tick 2)</text>
<text x="35" y="62" text-anchor="start" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="var(--fig-ink)">producers</text>
<text x="360" y="62" text-anchor="start" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="var(--fig-ink)">environment_values</text>
<text x="735" y="62" text-anchor="start" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="var(--fig-ink)">output projection</text>
<rect x="35" y="82" width="235" height="44" rx="5" fill="var(--fig-blue)" stroke="var(--fig-blue-line)" stroke-width="1.5"/>
<text x="152" y="109" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="var(--fig-ink)">input[0]: x = 8</text>
<rect x="360" y="82" width="275" height="44" rx="5" fill="var(--fig-blue)" stroke="var(--fig-blue-line)" stroke-width="1.5"/>
<text x="497" y="109" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="var(--fig-ink)">EnvironmentSlot(0): x = 8</text>
<line x1="270" y1="104" x2="360" y2="104" stroke="var(--fig-line)" stroke-width="1.8" marker-end="url(#environment-arrow)"/>
<rect x="35" y="142" width="235" height="44" rx="5" fill="var(--fig-green)" stroke="var(--fig-green-line)" stroke-width="1.5"/>
<text x="152" y="169" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="var(--fig-ink)">scaled -&gt; 16</text>
<rect x="360" y="142" width="275" height="44" rx="5" fill="var(--fig-green)" stroke="var(--fig-green-line)" stroke-width="1.5"/>
<text x="497" y="169" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="var(--fig-ink)">EnvironmentSlot(1): scaled = 16</text>
<line x1="270" y1="164" x2="360" y2="164" stroke="var(--fig-line)" stroke-width="1.8" marker-end="url(#environment-arrow)"/>
<rect x="35" y="202" width="235" height="44" rx="5" fill="var(--fig-orange)" stroke="var(--fig-orange-line)" stroke-width="1.5"/>
<text x="152" y="229" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="var(--fig-ink)">total -&gt; 24</text>
<rect x="360" y="202" width="275" height="44" rx="5" fill="var(--fig-orange)" stroke="var(--fig-orange-line)" stroke-width="1.5"/>
<text x="497" y="229" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="var(--fig-ink)">EnvironmentSlot(2): total = 24</text>
<line x1="270" y1="224" x2="360" y2="224" stroke="var(--fig-line)" stroke-width="1.8" marker-end="url(#environment-arrow)"/>
<rect x="35" y="262" width="235" height="44" rx="5" fill="var(--fig-purple)" stroke="var(--fig-purple-line)" stroke-width="1.5"/>
<text x="152" y="289" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="var(--fig-ink)">alert -&gt; true</text>
<rect x="360" y="262" width="275" height="44" rx="5" fill="var(--fig-purple)" stroke="var(--fig-purple-line)" stroke-width="1.5"/>
<text x="497" y="289" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="var(--fig-ink)">EnvironmentSlot(3): alert = true</text>
<line x1="270" y1="284" x2="360" y2="284" stroke="var(--fig-line)" stroke-width="1.8" marker-end="url(#environment-arrow)"/>
<rect x="735" y="82" width="190" height="44" rx="5" fill="var(--fig-purple)" stroke="var(--fig-purple-line)" stroke-width="1.5"/>
<text x="830" y="109" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="var(--fig-ink)">output[0]: alert</text>
<path d="M 635 284 C 685 284, 685 104, 735 104" fill="none" stroke="var(--fig-purple-line)" stroke-width="1.8" marker-end="url(#environment-arrow)"/>
<rect x="735" y="172" width="190" height="44" rx="5" fill="var(--fig-orange)" stroke="var(--fig-orange-line)" stroke-width="1.5"/>
<text x="830" y="199" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="var(--fig-ink)">output[1]: scaled</text>
<path d="M 635 164 C 685 164, 685 194, 735 194" fill="none" stroke="var(--fig-green-line)" stroke-width="1.8" marker-end="url(#environment-arrow)"/>
<rect x="735" y="262" width="190" height="44" rx="5" fill="var(--fig-orange)" stroke="var(--fig-orange-line)" stroke-width="1.5"/>
<text x="830" y="289" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="var(--fig-ink)">output[2]: total</text>
<path d="M 635 224 C 685 224, 685 284, 735 284" fill="none" stroke="var(--fig-orange-line)" stroke-width="1.8" marker-end="url(#environment-arrow)"/>
<text x="35" y="346" text-anchor="start" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="var(--fig-ink-2)">The scheduler may reorder stream evaluation; state and slots do not move</text>
<text x="735" y="346" text-anchor="start" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="var(--fig-ink)">output slots = [3, 1, 2]</text>
</svg>
