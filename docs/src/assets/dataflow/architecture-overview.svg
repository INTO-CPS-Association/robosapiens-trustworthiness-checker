<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 930" role="img" aria-labelledby="architecture-overview-title architecture-overview-desc" style="width:100%;max-width:760px;height:auto;background:#ffffff;border:1px solid #d0d7de;border-radius:6px">
<title id="architecture-overview-title">Dataflow architecture from specification to logical ticks</title>
<desc id="architecture-overview-desc">A DSRV specification compiles into immutable bound stream programs and a monitor plan. At runtime a persistent evaluator arena and mutable scheduler and reconfiguration state produce a schedule-specific plan bundle. Canonical, quickened, and JIT execution tiers execute that plan while preserving one logical tick and temporal commit boundary.</desc>
<defs>
  <marker id="architecture-overview-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#65758b"/>
  </marker>
</defs>
<text x="24" y="29" text-anchor="start" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#17212b">Compile once; advance one coherent row per tick</text>
<rect x="140" y="55" width="480" height="70" rx="5" fill="#e8f1fb" stroke="#2563a6" stroke-width="1.5"/>
<text x="380" y="87" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">DSRV specification</text>
<text x="380" y="106" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">typed or untyped stream equations</text>
<line x1="380" y1="125" x2="380" y2="160" stroke="#65758b" stroke-width="1.8" marker-end="url(#architecture-overview-arrow)"/>
<rect x="140" y="160" width="480" height="82" rx="5" fill="#e6f5f0" stroke="#147d64" stroke-width="1.5"/>
<text x="380" y="193" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">immutable StreamPrograms + MonitorPlan</text>
<text x="380" y="213" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">bound graphs, stable slots, dependencies, commit set</text>
<text x="380" y="230" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#52606d">shared across every schedule and execution tier</text>
<line x1="380" y1="242" x2="380" y2="286" stroke="#65758b" stroke-width="1.8" marker-end="url(#architecture-overview-arrow)"/>
<rect x="45" y="286" width="670" height="200" rx="8" fill="#f7f9fb" stroke="#a8b3bf" stroke-width="1.5"/>
<text x="65" y="313" text-anchor="start" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#17212b">DataflowMonitor runtime</text>
<rect x="75" y="338" width="285" height="104" rx="5" fill="#f3ebf8" stroke="#8055a3" stroke-width="1.5"/>
<text x="217" y="370" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">persistent EvaluatorArena</text>
<text x="217" y="391" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">one evaluator per logical stream</text>
<text x="217" y="410" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">owns canonical language state</text>
<text x="217" y="429" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#52606d">identity never follows schedule order</text>
<rect x="400" y="338" width="285" height="104" rx="5" fill="#fff1e6" stroke="#b54708" stroke-width="1.5"/>
<text x="542" y="370" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">mutable runtime control</text>
<text x="542" y="391" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">Scheduler + ReconfigurationState</text>
<text x="542" y="410" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">active edges and source/main ranges</text>
<text x="542" y="429" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#52606d">repairs order only when required</text>
<path d="M 217 442 L 217 505 L 330 535" fill="none" stroke="#65758b" stroke-width="1.8" marker-end="url(#architecture-overview-arrow)"/>
<path d="M 542 442 L 542 505 L 430 535" fill="none" stroke="#65758b" stroke-width="1.8" marker-end="url(#architecture-overview-arrow)"/>
<rect x="140" y="535" width="480" height="78" rx="5" fill="#f3ebf8" stroke="#8055a3" stroke-width="1.5"/>
<text x="380" y="568" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">schedule-specific PlanBundle</text>
<text x="380" y="588" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">ScheduledExecutionPlan + derived QuickPlan</text>
<text x="380" y="604" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#52606d">replaceable routing; no canonical state</text>
<line x1="380" y1="613" x2="380" y2="652" stroke="#65758b" stroke-width="1.8" marker-end="url(#architecture-overview-arrow)"/>
<rect x="45" y="652" width="670" height="148" rx="8" fill="#f7f9fb" stroke="#a8b3bf" stroke-width="1.5"/>
<text x="65" y="679" text-anchor="start" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#17212b">Equivalent execution tiers</text>
<rect x="75" y="704" width="185" height="66" rx="5" fill="#e6f5f0" stroke="#147d64" stroke-width="1.5"/>
<text x="167" y="735" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">canonical</text>
<text x="167" y="753" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">universal fallback</text>
<rect x="287" y="704" width="185" height="66" rx="5" fill="#fff1e6" stroke="#b54708" stroke-width="1.5"/>
<text x="379" y="735" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">quickened</text>
<text x="379" y="753" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">schedule routing</text>
<rect x="499" y="704" width="185" height="66" rx="5" fill="#f3ebf8" stroke="#8055a3" stroke-width="1.5"/>
<text x="591" y="735" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">JIT</text>
<text x="591" y="753" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">fused or per-stream</text>
<line x1="167" y1="770" x2="330" y2="835" stroke="#65758b" stroke-width="1.8" marker-end="url(#architecture-overview-arrow)"/>
<line x1="379" y1="770" x2="379" y2="835" stroke="#65758b" stroke-width="1.8" marker-end="url(#architecture-overview-arrow)"/>
<line x1="591" y1="770" x2="430" y2="835" stroke="#65758b" stroke-width="1.8" marker-end="url(#architecture-overview-arrow)"/>
<rect x="140" y="835" width="480" height="70" rx="5" fill="#e6f5f0" stroke="#147d64" stroke-width="1.5"/>
<text x="380" y="867" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">one logical tick + commit boundary</text>
<text x="380" y="887" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">publish one coherent row; commit temporal state once</text>
</svg>
