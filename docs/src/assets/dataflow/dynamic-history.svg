<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="dynamic-history-title dynamic-history-desc" style="width:100%;max-width:1000px;height:auto;background:#ffffff;border:1px solid #d0d7de;border-radius:6px">
<title id="dynamic-history-title">Nested and monitor history across dynamic replacement</title>
<desc id="dynamic-history-desc">Before replacement, evaluator A owns a local x indexed-by-two DelayState ring, while the enclosing monitor owns HistoryStore storage used by a direct downstream z indexed-by-one read. During replacement, compatible local evaluator state may move from A to B; otherwise B starts with an empty ring and its positive delay returns Deferred while filling. The monitor HistoryStore remains with the unchanged enclosing monitor and continues recording z. Only the immediately previous active evaluator can donate compatible state.</desc>
<defs><marker id="dynamic-history-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#65758b"/></marker></defs>
<rect x="1" y="1" width="998" height="358" rx="6" fill="#ffffff"/>
<text x="24" y="30" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#17212b">Dynamic replacement changes nested owners, not enclosing monitor history</text>
<text x="30" y="73" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#17212b">active body A</text>
<text x="30" y="235" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#17212b">replacement body B</text>

<g font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#17212b" text-anchor="middle">
<rect x="55" y="92" width="120" height="52" rx="5" fill="#e8f1fb" stroke="#2563a6" stroke-width="1.5"/><text x="115" y="123">current x</text>
<rect x="220" y="92" width="150" height="52" rx="5" fill="#fff1e6" stroke="#b54708" stroke-width="1.5"/><text x="295" y="123">Evaluator A</text>
<rect x="415" y="82" width="190" height="72" rx="5" fill="#fff1e6" stroke="#b54708" stroke-width="1.5"/><text x="510" y="111">local DelayState</text><text x="510" y="132" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#52606d">x[2] ring</text>
<rect x="650" y="92" width="80" height="52" rx="5" fill="#e6f5f0" stroke="#147d64" stroke-width="1.5"/><text x="690" y="123">z</text>
<rect x="775" y="82" width="185" height="72" rx="5" fill="#f3ebf8" stroke="#8055a3" stroke-width="1.5"/><text x="867" y="111">HistoryStore(z)</text><text x="867" y="132" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#52606d">direct downstream z[1]</text>

<rect x="55" y="252" width="120" height="52" rx="5" fill="#e8f1fb" stroke="#2563a6" stroke-width="1.5"/><text x="115" y="283">current x</text>
<rect x="220" y="252" width="150" height="52" rx="5" fill="#fff1e6" stroke="#b54708" stroke-width="1.5"/><text x="295" y="283">Evaluator B</text>
<rect x="415" y="242" width="190" height="72" rx="5" fill="#fff1e6" stroke="#b54708" stroke-width="1.5"/><text x="510" y="271">local DelayState</text><text x="510" y="292" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#52606d">moved if compatible; else cold</text>
<rect x="650" y="252" width="80" height="52" rx="5" fill="#e6f5f0" stroke="#147d64" stroke-width="1.5"/><text x="690" y="283">z</text>
<rect x="775" y="242" width="185" height="72" rx="5" fill="#f3ebf8" stroke="#8055a3" stroke-width="1.5"/><text x="867" y="271">same HistoryStore</text><text x="867" y="292" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#52606d">continues with enclosing monitor</text>
</g>
<g fill="none" stroke="#65758b" stroke-width="1.8" marker-end="url(#dynamic-history-arrow)">
<path d="M175 118 H220"/><path d="M370 118 H415"/><path d="M605 118 H650"/><path d="M730 118 H775"/>
<path d="M175 278 H220"/><path d="M370 278 H415"/><path d="M605 278 H650"/><path d="M730 278 H775"/>
<path d="M295 144 V252" stroke-dasharray="5 4"/><path d="M510 154 V242" stroke-dasharray="5 4"/><path d="M867 154 V242"/>
</g>
<text x="307" y="204" font-family="system-ui, sans-serif" font-size="11" fill="#52606d">replace</text>
<text x="522" y="194" font-family="system-ui, sans-serif" font-size="11" fill="#52606d">transfer only from A when compatible</text>
<text x="879" y="204" font-family="system-ui, sans-serif" font-size="11" fill="#52606d">unchanged owner</text>
<text x="500" y="342" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#52606d">A cold local positive delay returns Value::Deferred until enough activation-local samples have committed.</text>
</svg>
