<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="architecture-failure-ladder-title architecture-failure-ladder-desc" style="width:100%;max-width:760px;height:auto;background:#ffffff;border:1px solid #d0d7de;border-radius:6px">
<title id="architecture-failure-ladder-title">Failure containment levels in the dataflow subsystem</title>
<desc id="architecture-failure-ladder-desc">Five nested containment levels. A quickened node deoptimizes and a native artifact disables, both recovering into canonical evaluation within the same successful tick. Outside those, a failed tick discards staged temporal writes and poisons the monitor permanently, and a failed root replacement terminates the reconfigurable owner loop. The outer three levels are terminal because non-temporal evaluator state is not rolled back.</desc>
<text x="24" y="29" text-anchor="start" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#17212b">Failure containment: each level absorbs what it can represent</text>
<text x="24" y="49" text-anchor="start" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">Nothing below the input stream is transactional, so nothing outside the inner two levels can be retried.</text>

<rect x="40" y="70" width="500" height="410" rx="6" fill="#fff1e6" stroke="#b54708" stroke-width="1.6"/>
<text x="58" y="92" text-anchor="start" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#17212b">owner loop</text>
<text x="58" y="110" text-anchor="start" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#52606d">root replacement fails → runtime returns Err, no rollback after drain</text>

<rect x="66" y="122" width="448" height="336" rx="6" fill="#f3ebf8" stroke="#8055a3" stroke-width="1.6"/>
<text x="84" y="144" text-anchor="start" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#17212b">monitor lifetime</text>
<text x="84" y="162" text-anchor="start" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#52606d">poisoned → every later evaluate returns MonitorFailed</text>

<rect x="92" y="174" width="396" height="262" rx="6" fill="#e8f1fb" stroke="#2563a6" stroke-width="1.6"/>
<text x="110" y="196" text-anchor="start" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#17212b">one tick</text>
<text x="110" y="214" text-anchor="start" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#52606d">no output projected, no temporal commit, no defer release</text>

<rect x="118" y="226" width="344" height="188" rx="6" fill="#e6f5f0" stroke="#147d64" stroke-width="1.6"/>
<text x="136" y="248" text-anchor="start" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#17212b">native artifact</text>
<text x="136" y="266" text-anchor="start" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#52606d">disable, materialize state, replay, continue canonically</text>

<rect x="144" y="278" width="292" height="114" rx="6" fill="#f7f9fb" stroke="#a8b3bf" stroke-width="1.6"/>
<text x="162" y="300" text-anchor="start" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#17212b">quickened node</text>
<text x="162" y="318" text-anchor="start" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#52606d">deoptimize this node only,</text>
<text x="162" y="334" text-anchor="start" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#52606d">restore canonical lifting state,</text>
<text x="162" y="350" text-anchor="start" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#52606d">evaluate canonically</text>
<text x="162" y="374" text-anchor="start" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#147d64">the tick still succeeds</text>

<line x1="556" y1="278" x2="556" y2="392" stroke="#147d64" stroke-width="2.4"/>
<text x="572" y="326" text-anchor="start" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#147d64">recoverable</text>
<text x="572" y="344" text-anchor="start" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#52606d">expected tier behaviour</text>

<line x1="556" y1="70" x2="556" y2="262" stroke="#b54708" stroke-width="2.4"/>
<text x="572" y="150" text-anchor="start" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#b54708">terminal</text>
<text x="572" y="168" text-anchor="start" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#52606d">state already advanced</text>
<text x="572" y="184" text-anchor="start" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#52606d">and is not rolled back</text>

<text x="24" y="504" text-anchor="start" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#52606d">Arity mismatches sit outside this diagram: they are rejected before execute_tick, so nothing has advanced and the caller may retry.</text>
</svg>
