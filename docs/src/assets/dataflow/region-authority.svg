<svg xmlns="http://www.w3.org/2000/svg" class="tc-figure" viewBox="0 0 960 344" role="img" aria-labelledby="region-authority-title region-authority-desc" style="width:100%; max-width:960px; height:auto;">
  <title id="region-authority-title">Region state authority and the operations that move it</title>
  <desc id="region-authority-desc">Read left to right. One scalar region has exactly one authoritative executor at a time: Canonical, Quickened, or Native. Canonical owns EvaluatorState node values and node states; Quickened owns typed registers and lifting state; Native owns a compiled kernel and its own state allocation. Solid arrows on the upper lane are synchronize, which pulls state into an executor and may decline. Solid arrows on the lower lane are materialize, which writes state back to the canonical arena and never fails. The dashed arrow is a row-level decline: a quickened region checks its inputs and hands the whole row to canonical evaluation before executing any of it, which changes no authority. The dotted arrow is a native guard miss during a tick. Every route change is preceded by materialize, funnelled through materialize_authoritative_state.</desc>
  <style>
    .tc-figure {
      --fig-bg: #ffffff; --fig-edge: #d0d7de;
      --fig-ink: #17212b; --fig-ink-2: #52606d; --fig-line: #65758b;
      --fig-panel: #f7f9fb; --fig-panel-line: #a8b3bf;
      --fig-blue: #e8f1fb; --fig-blue-line: #2563a6;
      --fig-green: #e6f5f0; --fig-green-line: #147d64;
      --fig-orange: #fff1e6; --fig-orange-line: #b54708;
      --fig-purple: #f3ebf8; --fig-purple-line: #8055a3;
    }
    @media (prefers-color-scheme: dark) {
      .tc-figure {
        --fig-bg: #171b26; --fig-edge: #333a4d;
        --fig-ink: #e6e9f0; --fig-ink-2: #a2acbd; --fig-line: #8492a6;
        --fig-panel: #1e2432; --fig-panel-line: #3d465c;
        --fig-blue: #16283d; --fig-blue-line: #6aa9e0;
        --fig-green: #123029; --fig-green-line: #4fbfa0;
        --fig-orange: #33240f; --fig-orange-line: #e0a44e;
        --fig-purple: #241c33; --fig-purple-line: #b18fd4;
      }
    }
  </style>
  <defs>
    <marker id="region-authority-arrow" markerWidth="7" markerHeight="7" refX="9" refY="5" viewBox="0 0 10 10" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--fig-line)" />
    </marker>
    <marker id="region-authority-arrow-warn" markerWidth="7" markerHeight="7" refX="9" refY="5" viewBox="0 0 10 10" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--fig-orange-line)" />
    </marker>
  </defs>
  <rect x="0.75" y="0.75" width="958.5" height="342.5" rx="6" fill="var(--fig-bg)" stroke="var(--fig-edge)" stroke-width="1.5" />
  <text x="30" y="34" fill="var(--fig-ink)" font-family="system-ui, sans-serif" font-size="15" font-weight="700">One region, one authority at a time</text>
  <text x="30" y="56" fill="var(--fig-ink-2)" font-family="system-ui, sans-serif" font-size="12">RegionAuthority records which executor owns this region&#8217;s semantic state right now.</text>
  <rect x="30" y="76" width="240" height="86" rx="7" fill="var(--fig-green)" stroke="var(--fig-green-line)" stroke-width="2" />
  <text x="46" y="102" fill="var(--fig-ink)" font-family="ui-monospace, monospace" font-size="13" font-weight="600">::Canonical</text>
  <text x="46" y="124" fill="var(--fig-ink-2)" font-family="system-ui, sans-serif" font-size="11">EvaluatorState</text>
  <text x="46" y="142" fill="var(--fig-ink-2)" font-family="ui-monospace, monospace" font-size="11">node_values &#183; node_states</text>
  <rect x="360" y="76" width="240" height="86" rx="7" fill="var(--fig-blue)" stroke="var(--fig-blue-line)" stroke-width="1.5" />
  <text x="376" y="102" fill="var(--fig-ink)" font-family="ui-monospace, monospace" font-size="13" font-weight="600">::Quickened</text>
  <text x="376" y="124" fill="var(--fig-ink-2)" font-family="system-ui, sans-serif" font-size="11">QuickenedRegionState</text>
  <text x="376" y="142" fill="var(--fig-ink-2)" font-family="system-ui, sans-serif" font-size="11">typed registers &#183; lifting state</text>
  <rect x="690" y="76" width="240" height="86" rx="7" fill="var(--fig-purple)" stroke="var(--fig-purple-line)" stroke-width="1.5" />
  <text x="706" y="102" fill="var(--fig-ink)" font-family="ui-monospace, monospace" font-size="13" font-weight="600">::Native</text>
  <text x="706" y="124" fill="var(--fig-ink-2)" font-family="system-ui, sans-serif" font-size="11">compiled kernel</text>
  <text x="706" y="142" fill="var(--fig-ink-2)" font-family="system-ui, sans-serif" font-size="11">private state allocation</text>
  <text x="315" y="90" text-anchor="middle" fill="var(--fig-ink-2)" font-family="ui-monospace, monospace" font-size="11">synchronize</text>
  <path d="M 272 100 H 354" fill="none" stroke="var(--fig-line)" stroke-width="1.6" marker-end="url(#region-authority-arrow)" />
  <text x="315" y="158" text-anchor="middle" fill="var(--fig-ink-2)" font-family="ui-monospace, monospace" font-size="11">materialize</text>
  <path d="M 354 138 H 272" fill="none" stroke="var(--fig-line)" stroke-width="1.6" marker-end="url(#region-authority-arrow)" />
  <text x="645" y="90" text-anchor="middle" fill="var(--fig-ink-2)" font-family="ui-monospace, monospace" font-size="11">activate</text>
  <path d="M 602 100 H 684" fill="none" stroke="var(--fig-line)" stroke-width="1.6" marker-end="url(#region-authority-arrow)" />
  <text x="645" y="158" text-anchor="middle" fill="var(--fig-ink-2)" font-family="ui-monospace, monospace" font-size="11">materialize</text>
  <path d="M 684 138 H 602" fill="none" stroke="var(--fig-line)" stroke-width="1.6" marker-end="url(#region-authority-arrow)" />
  <path d="M 480 164 V 196 H 150 V 166" fill="none" stroke="var(--fig-orange-line)" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#region-authority-arrow-warn)" />
  <text x="490" y="192" fill="var(--fig-ink-2)" font-family="system-ui, sans-serif" font-size="11">declines the row before executing it &#8212; authority does not change</text>
  <path d="M 810 164 V 224 H 150 V 168" fill="none" stroke="var(--fig-orange-line)" stroke-width="1.4" stroke-dasharray="2 4" marker-end="url(#region-authority-arrow-warn)" />
  <text x="822" y="220" fill="var(--fig-ink-2)" font-family="system-ui, sans-serif" font-size="11">guard miss</text>
  <rect x="30" y="244" width="900" height="80" rx="7" fill="var(--fig-panel)" stroke="var(--fig-panel-line)" stroke-width="1.5" />
  <text x="46" y="266" fill="var(--fig-ink)" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Before any route changes</text>
  <text x="46" y="288" fill="var(--fig-ink-2)" font-family="system-ui, sans-serif" font-size="11">Schedule repair, context transfer, and tier activation all call <tspan font-family="ui-monospace, monospace">materialize_authoritative_state</tspan> first,</text>
  <text x="46" y="308" fill="var(--fig-ink-2)" font-family="system-ui, sans-serif" font-size="11">so the canonical arena is a complete description before a plan is rebuilt or replaced.</text>
</svg>
