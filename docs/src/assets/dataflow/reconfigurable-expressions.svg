<svg class="tc-figure" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" role="img" aria-labelledby="reconfigurable-expressions-arrow-title reconfigurable-expressions-arrow-desc" style="width:100%;max-width:920px;height:auto;background:var(--fig-bg);border:1px solid var(--fig-edge);border-radius:6px">
<title id="reconfigurable-expressions-arrow-title">Current value flow through three reconfigurable expressions</title>
<desc id="reconfigurable-expressions-arrow-desc">Sensor and baseline feed static stream score. Point one is the defer expression for limit; its current formula score plus ten activates score to limit, while baseline is permitted by the scope but is shown as one dashed inactive edge. The fixed decision equation contains point two and point three. Point two currently reads score and limit, so both feed it. Point three reads enabled. Their Boolean values are combined into the final decision output. Each orange point also names its source input and current formula.</desc>
  <!--
    Theme tokens. In the book these are overridden per theme by theme/diagram-theme.css; this block
    is the fallback that keeps the figure readable standalone, as an image, and when rustdoc inlines
    it with include_str!. Scoped to .tc-figure, never :root, so inlining cannot leak the names.
  -->
  <style>
    .tc-figure {
      --fig-bg: #ffffff;
      --fig-edge: #d0d7de;
      --fig-ink: #17212b;
      --fig-ink-2: #52606d;
      --fig-line: #65758b;
      --fig-panel: #f7f9fb;
      --fig-panel-line: #a8b3bf;
      --fig-blue: #e8f1fb;
      --fig-blue-line: #2563a6;
      --fig-green: #e6f5f0;
      --fig-green-line: #147d64;
      --fig-orange: #fff1e6;
      --fig-orange-line: #b54708;
      --fig-purple: #f3ebf8;
      --fig-purple-line: #8055a3;
      --fig-source: #eef6ff;
      --fig-source-line: #3478b8;
      --fig-redis: #fff5e8;
      --fig-redis-line: #bc6b16;
      --fig-checker: #f1ecff;
      --fig-checker-line: #7254b3;
      --fig-knowledge: #eaf8ee;
      --fig-knowledge-line: #39834d;
    }
    @media (prefers-color-scheme: dark) {
      .tc-figure {
        --fig-bg: #171b26;
        --fig-edge: #333a4d;
        --fig-ink: #e6e9f0;
        --fig-ink-2: #a2acbd;
        --fig-line: #8492a6;
        --fig-panel: #1e2432;
        --fig-panel-line: #3d465c;
        --fig-blue: #16283d;
        --fig-blue-line: #6aa9e0;
        --fig-green: #123029;
        --fig-green-line: #4fbfa0;
        --fig-orange: #33240f;
        --fig-orange-line: #e0a44e;
        --fig-purple: #241c33;
        --fig-purple-line: #b18fd4;
        --fig-source: #14283c;
        --fig-source-line: #6fa8db;
        --fig-redis: #33260f;
        --fig-redis-line: #d99a3f;
        --fig-checker: #241d34;
        --fig-checker-line: #a892d6;
        --fig-knowledge: #132c1c;
        --fig-knowledge-line: #5fae74;
      }
    }
  </style>
<defs>
