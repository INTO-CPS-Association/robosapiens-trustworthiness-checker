<svg class="tc-figure" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 405" role="img" aria-labelledby="function-binding-arrow-title function-binding-arrow-desc" style="width:100%;max-width:940px;height:auto;background:var(--fig-bg);border:1px solid var(--fig-edge);border-radius:6px">
<title id="function-binding-arrow-title">Current StreamFunction binding structures</title>
<desc id="function-binding-arrow-desc">Binding removes parameters from an UnboundFunction's free variables, resolves captures to outer EnvironmentSlots, binds the EvaluationGraph against a captures-first local EnvironmentLayout, and stores the resulting StreamProgram in StreamFunction.</desc>
  <!--
    Theme tokens. In the book these are overridden per theme by theme/diagram-theme.css; this block
    is the fallback that keeps the figure readable standalone, as an image, and when rustdoc inlines
    it with include_str!. Scoped to .tc-figure, never :root, so inlining cannot leak the names.
  -->
  <style>
    .tc-figure {
      --fig-bg: var(--fig-bg); --fig-edge: var(--fig-edge);
      --fig-ink: var(--fig-ink); --fig-ink-2: var(--fig-ink-2); --fig-line: var(--fig-line);
      --fig-panel: var(--fig-panel); --fig-panel-line: var(--fig-panel-line);
      --fig-blue: var(--fig-blue); --fig-blue-line: var(--fig-blue-line);
      --fig-green: var(--fig-green); --fig-green-line: var(--fig-green-line);
      --fig-orange: var(--fig-orange); --fig-orange-line: var(--fig-orange-line);
      --fig-purple: var(--fig-purple); --fig-purple-line: var(--fig-purple-line);
      --fig-source: var(--fig-source); --fig-source-line: var(--fig-source-line);
      --fig-redis: var(--fig-redis); --fig-redis-line: var(--fig-redis-line);
      --fig-checker: var(--fig-checker); --fig-checker-line: var(--fig-checker-line);
      --fig-knowledge: var(--fig-knowledge); --fig-knowledge-line: var(--fig-knowledge-line);
    }
    @media (prefers-color-scheme: dark) {
      .tc-figure {
        --fig-bg: #171b26; --fig-edge: #333a4d;
        --fig-ink: #e6e9f0; --fig-ink-2: #a2acbd; --fig-line: #8492a6;
        --fig-panel: #1e2432; --fig-panel-line: #3d465c;
        --fig-blue: #16283d; --fig-blue-line: #6aa9e0;
        --fig-green: #123029; --fig-green-line: #4fbfa0;
        --fig-orange: #33240f; --fig-orange-line: #e0a44e;
        --fig-purple: #241c33; --fig-purple-line: #b18fd4;
        --fig-source: #14283c; --fig-source-line: #6fa8db;
        --fig-redis: #33260f; --fig-redis-line: #d99a3f;
        --fig-checker: #241d34; --fig-checker-line: #a892d6;
        --fig-knowledge: #132c1c; --fig-knowledge-line: #5fae74;
      }
    }
  </style>
<defs>
  <marker id="function-binding-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--fig-line)"/>
  </marker>
</defs>
<text x="24" y="27" text-anchor="start" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="var(--fig-ink)">Bind UnboundFunction into StreamFunction</text>
<rect x="35" y="58" width="230" height="70" rx="5" fill="var(--fig-blue)" stroke="var(--fig-blue-line)" stroke-width="1.5"/>
<text x="150" y="91" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="var(--fig-ink)">UnboundFunction</text>
<text x="150" y="109" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="var(--fig-ink-2)">parameters + EvaluationGraph</text>
<rect x="335" y="58" width="250" height="70" rx="5" fill="var(--fig-green)" stroke="var(--fig-green-line)" stroke-width="1.5"/>
<text x="460" y="91" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="var(--fig-ink)">free vars - parameters</text>
<text x="460" y="109" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="var(--fig-ink-2)">resolve capture_slots</text>
<rect x="655" y="58" width="250" height="70" rx="5" fill="var(--fig-purple)" stroke="var(--fig-purple-line)" stroke-width="1.5"/>
<text x="780" y="91" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="var(--fig-ink)">StreamFunction</text>
<text x="780" y="109" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="var(--fig-ink-2)">parameters + display + program</text>
<line x1="265" y1="93" x2="335" y2="93" stroke="var(--fig-line)" stroke-width="1.8" marker-end="url(#function-binding-arrow)"/>
<line x1="585" y1="93" x2="655" y2="93" stroke="var(--fig-line)" stroke-width="1.8" marker-end="url(#function-binding-arrow)"/>
<rect x="175" y="190" width="250" height="70" rx="5" fill="var(--fig-orange)" stroke="var(--fig-orange-line)" stroke-width="1.5"/>
<text x="300" y="223" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="var(--fig-ink)">capture_slots</text>
<text x="300" y="241" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="var(--fig-ink-2)">Vec&lt;EnvironmentSlot&gt; in outer row</text>
<rect x="535" y="190" width="250" height="70" rx="5" fill="var(--fig-blue)" stroke="var(--fig-blue-line)" stroke-width="1.5"/>
<text x="660" y="223" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="var(--fig-ink)">Rc&lt;StreamProgram&gt;</text>
<text x="660" y="241" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="var(--fig-ink-2)">bound EvaluationGraph</text>
<line x1="460" y1="128" x2="300" y2="190" stroke="var(--fig-line)" stroke-width="1.8" marker-end="url(#function-binding-arrow)"/>
<line x1="780" y1="128" x2="660" y2="190" stroke="var(--fig-line)" stroke-width="1.8" marker-end="url(#function-binding-arrow)"/>
<rect x="355" y="310" width="250" height="64" rx="5" fill="var(--fig-panel)" stroke="var(--fig-panel-line)" stroke-width="1.5"/>
<text x="480" y="340" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="var(--fig-ink)">local EnvironmentLayout</text>
<text x="480" y="358" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="var(--fig-ink-2)">[captures | parameters]</text>
<line x1="300" y1="260" x2="430" y2="310" stroke="var(--fig-line)" stroke-width="1.8" marker-end="url(#function-binding-arrow)"/>
<line x1="660" y1="260" x2="530" y2="310" stroke="var(--fig-line)" stroke-width="1.8" marker-end="url(#function-binding-arrow)"/>
</svg>
