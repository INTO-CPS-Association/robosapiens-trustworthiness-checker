<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 405" role="img" aria-labelledby="function-binding-arrow-title function-binding-arrow-desc" style="width:100%;max-width:940px;height:auto;background:#ffffff;border:1px solid #d0d7de;border-radius:6px">
<title id="function-binding-arrow-title">Current StreamFunction binding structures</title>
<desc id="function-binding-arrow-desc">Binding removes parameters from an UnboundFunction's free variables, resolves captures to outer EnvironmentSlots, binds the EvaluationGraph against a captures-first local EnvironmentLayout, and stores the resulting StreamProgram in StreamFunction.</desc>
<defs>
  <marker id="function-binding-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#65758b"/>
  </marker>
</defs>
<text x="24" y="27" text-anchor="start" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#17212b">Bind UnboundFunction into StreamFunction</text>
<rect x="35" y="58" width="230" height="70" rx="5" fill="#e8f1fb" stroke="#2563a6" stroke-width="1.5"/>
<text x="150" y="91" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">UnboundFunction</text>
<text x="150" y="109" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">parameters + EvaluationGraph</text>
<rect x="335" y="58" width="250" height="70" rx="5" fill="#e6f5f0" stroke="#147d64" stroke-width="1.5"/>
<text x="460" y="91" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">free vars - parameters</text>
<text x="460" y="109" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">resolve capture_slots</text>
<rect x="655" y="58" width="250" height="70" rx="5" fill="#f3ebf8" stroke="#8055a3" stroke-width="1.5"/>
<text x="780" y="91" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">StreamFunction</text>
<text x="780" y="109" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">parameters + display + program</text>
<line x1="265" y1="93" x2="335" y2="93" stroke="#65758b" stroke-width="1.8" marker-end="url(#function-binding-arrow)"/>
<line x1="585" y1="93" x2="655" y2="93" stroke="#65758b" stroke-width="1.8" marker-end="url(#function-binding-arrow)"/>
<rect x="175" y="190" width="250" height="70" rx="5" fill="#fff1e6" stroke="#b54708" stroke-width="1.5"/>
<text x="300" y="223" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">capture_slots</text>
<text x="300" y="241" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">Vec&lt;EnvironmentSlot&gt; in outer row</text>
<rect x="535" y="190" width="250" height="70" rx="5" fill="#e8f1fb" stroke="#2563a6" stroke-width="1.5"/>
<text x="660" y="223" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">Rc&lt;StreamProgram&gt;</text>
<text x="660" y="241" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">bound EvaluationGraph</text>
<line x1="460" y1="128" x2="300" y2="190" stroke="#65758b" stroke-width="1.8" marker-end="url(#function-binding-arrow)"/>
<line x1="780" y1="128" x2="660" y2="190" stroke="#65758b" stroke-width="1.8" marker-end="url(#function-binding-arrow)"/>
<rect x="355" y="310" width="250" height="64" rx="5" fill="#f7f9fb" stroke="#a8b3bf" stroke-width="1.5"/>
<text x="480" y="340" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">local EnvironmentLayout</text>
<text x="480" y="358" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">[captures | parameters]</text>
<line x1="300" y1="260" x2="430" y2="310" stroke="#65758b" stroke-width="1.8" marker-end="url(#function-binding-arrow)"/>
<line x1="660" y1="260" x2="530" y2="310" stroke="#65758b" stroke-width="1.8" marker-end="url(#function-binding-arrow)"/>
</svg>
