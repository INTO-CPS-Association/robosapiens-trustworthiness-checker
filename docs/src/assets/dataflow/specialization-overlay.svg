<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" role="img" aria-labelledby="specialization-arrow-title specialization-arrow-desc" style="width:100%;max-width:1040px;height:auto;background:#ffffff;border:1px solid #d0d7de;border-radius:6px">
  <title id="specialization-arrow-title">QuickPlan overlays canonical stream evaluators</title>
  <desc id="specialization-arrow-desc">The canonical StreamPrograms, EvaluatorStates, and environment Value row remain authoritative. For the running example, QuickPlan routes scaled as a complete ScalarRun, total as a Graph step whose historical and default work remains canonical while eligible addition may be scalar, and alert as a complete ScalarRun. Scalar node results mirror into canonical EvaluatorState node_values before each stream result is published to its environment slot. A runtime kind mismatch restores lifting state, marks only that quickening node Deoptimized, and evaluates it canonically while neighboring eligible work continues. JIT is a separate native coordinator.</desc>
  <defs><marker id="specialization-arrow" markerWidth="7" markerHeight="7" refX="9" refY="5" viewBox="0 0 10 10" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 10 5 L 0 10 z" fill="#65758b"/></marker></defs>
  <text x="24" y="30" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#17212b">Quickening changes the route, not the semantic owners</text>
  <text x="30" y="65" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#17212b">canonical authority</text>
  <rect x="30" y="80" width="285" height="68" rx="5" fill="#e8f1fb" stroke="#2563a6" stroke-width="1.5"/>
  <text x="172" y="109" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">StreamProgram graphs</text><text x="172" y="129" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#52606d">complete operation semantics</text>
  <rect x="377" y="80" width="285" height="68" rx="5" fill="#e8f1fb" stroke="#2563a6" stroke-width="1.5"/>
  <text x="519" y="109" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">EvaluatorState</text><text x="519" y="129" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#52606d">node_values + canonical NodeState</text>
  <rect x="725" y="80" width="285" height="68" rx="5" fill="#e8f1fb" stroke="#2563a6" stroke-width="1.5"/>
  <text x="867" y="109" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">environment_values</text><text x="867" y="129" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#52606d">published stream results as Value</text>
  <path d="M 315 114 H 377" fill="none" stroke="#65758b" stroke-width="1.6" marker-end="url(#specialization-arrow)"/><path d="M 662 114 H 725" fill="none" stroke="#65758b" stroke-width="1.6" marker-end="url(#specialization-arrow)"/>

  <line x1="20" y1="175" x2="1020" y2="175" stroke="#a8b3bf"/>
  <text x="30" y="207" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#17212b">active PlanBundle.quick for the running example</text>
  <rect x="30" y="225" width="250" height="92" rx="7" fill="#e6f5f0" stroke="#147d64" stroke-width="1.5"/>
  <text x="155" y="252" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">ScalarRun [scaled]</text><text x="155" y="274" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#52606d">multiply as one scalar stream</text><text x="155" y="294" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#52606d">publish EnvironmentSlot(scaled)</text>
  <rect x="320" y="210" width="400" height="122" rx="7" fill="#fff1e6" stroke="#b54708" stroke-width="1.5"/>
  <text x="520" y="237" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">Graph [total]</text>
  <rect x="342" y="253" width="170" height="54" rx="5" fill="#ffffff" stroke="#b54708"/>
  <text x="427" y="276" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#17212b">canonical history + default</text><text x="427" y="294" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#52606d">special values and state</text>
  <rect x="530" y="253" width="168" height="54" rx="5" fill="#e6f5f0" stroke="#147d64"/>
  <text x="614" y="276" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#17212b">eligible scalar add</text><text x="614" y="294" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#52606d">mixed node plan</text>
  <path d="M 512 280 H 530" fill="none" stroke="#65758b" stroke-width="1.4" marker-end="url(#specialization-arrow)"/>
  <rect x="760" y="225" width="250" height="92" rx="7" fill="#e6f5f0" stroke="#147d64" stroke-width="1.5"/>
  <text x="885" y="252" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">ScalarRun [alert]</text><text x="885" y="274" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#52606d">comparison reads published total</text><text x="885" y="294" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#52606d">publish EnvironmentSlot(alert)</text>
  <path d="M 280 271 H 320" fill="none" stroke="#65758b" stroke-width="1.6" marker-end="url(#specialization-arrow)"/><path d="M 720 271 H 760" fill="none" stroke="#65758b" stroke-width="1.6" marker-end="url(#specialization-arrow)"/>

  <rect x="245" y="365" width="550" height="56" rx="7" fill="#f3ebf8" stroke="#8055a3" stroke-width="1.5"/>
  <text x="520" y="389" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#17212b">scalar result → canonical node_values → stream environment slot</text>
  <text x="520" y="408" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#52606d">canonical neighbors and fallback observe one coherent representation</text>
  <path d="M 520 332 V 365" fill="none" stroke="#65758b" stroke-width="1.6" marker-end="url(#specialization-arrow)"/>

  <rect x="30" y="447" width="260" height="38" rx="5" fill="#fff1e6" stroke="#b54708" stroke-width="1.5"/>
  <text x="160" y="471" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#17212b">kind mismatch: restore lift state</text>
  <rect x="390" y="447" width="260" height="38" rx="5" fill="#fff1e6" stroke="#b54708" stroke-width="1.5"/>
  <text x="520" y="471" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#17212b">mark this node Deoptimized</text>
  <rect x="750" y="447" width="260" height="38" rx="5" fill="#e6f5f0" stroke="#147d64" stroke-width="1.5"/>
  <text x="880" y="471" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#17212b">neighboring eligible work continues</text>
  <path d="M 290 466 H 390" fill="none" stroke="#65758b" stroke-width="1.5" marker-end="url(#specialization-arrow)"/><path d="M 650 466 H 750" fill="none" stroke="#65758b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#specialization-arrow)"/>
</svg>
