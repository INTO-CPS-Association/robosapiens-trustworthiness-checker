<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" role="img" aria-labelledby="architecture-owner-loop-title architecture-owner-loop-desc" style="width:100%;max-width:760px;height:auto;background:#ffffff;border:1px solid #d0d7de;border-radius:6px">
<title id="architecture-owner-loop-title">The reconfigurable owner loop and its four exits</title>
<desc id="architecture-owner-loop-desc">Each iteration of the owner loop awaits the next typed input item. A writer send, flush, or close failure is terminal and follows the cleanup path. Otherwise the item dispatches four ways: a data batch is evaluated by DirectDataflowEngine and submitted as packed OutputBatch values while the owner refreshes its revision, a reconfigure item performs a root cutover and continues with a new input generation and OutputWriter, end of input flushes and closes the writer for success, and an input error drains accepted output before returning the error. Only the data and reconfigure paths continue looping.</desc>
<defs>
  <marker id="architecture-owner-loop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#65758b"/>
  </marker>
  <marker id="architecture-owner-loop-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#147d64"/>
  </marker>
  <marker id="architecture-owner-loop-exit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#b54708"/>
  </marker>
</defs>
<text x="24" y="29" text-anchor="start" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#17212b">Owner loop: one monitor, one input generation, one output writer</text>

<rect x="212" y="52" width="336" height="80" rx="5" fill="#f3ebf8" stroke="#8055a3" stroke-width="1.6"/>
<text x="380" y="78" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">await input.next()</text>
<text x="380" y="98" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">one typed item at a time</text>
<text x="380" y="118" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#52606d">writer failures surface at send/flush/close</text>

<line x1="212" y1="92" x2="150" y2="92" stroke="#b54708" stroke-width="1.6" marker-end="url(#architecture-owner-loop-exit)"/>
<rect x="24" y="66" width="122" height="52" rx="5" fill="#fff1e6" stroke="#b54708" stroke-width="1.5"/>
<text x="85" y="88" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#17212b">OutputWriter error</text>
<text x="85" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#52606d">terminal → drain/return</text>

<line x1="380" y1="132" x2="380" y2="166" stroke="#65758b" stroke-width="1.8" marker-end="url(#architecture-owner-loop-arrow)"/>
<text x="392" y="154" text-anchor="start" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#52606d">typed item</text>

<rect x="40" y="182" width="150" height="96" rx="5" fill="#e6f5f0" stroke="#147d64" stroke-width="1.6"/>
<text x="115" y="206" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#17212b">Data(batch)</text>
<text x="115" y="226" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#52606d">evaluate with DirectDataflowEngine</text>
<text x="115" y="244" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#52606d">submit packed OutputBatch</text>
<text x="115" y="266" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#147d64">refresh revision</text>

<rect x="206" y="182" width="164" height="96" rx="5" fill="#e6f5f0" stroke="#147d64" stroke-width="1.6"/>
<text x="288" y="206" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#17212b">Reconfigure(config)</text>
<text x="288" y="226" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#52606d">root cutover</text>
<text x="288" y="244" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#52606d">new input + writer</text>
<text x="288" y="266" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#52606d">acknowledgement last</text>

<rect x="386" y="182" width="156" height="96" rx="5" fill="#fff1e6" stroke="#b54708" stroke-width="1.6"/>
<text x="464" y="206" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#17212b">None — input EOF</text>
<text x="464" y="226" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#52606d">flush + close writer</text>
<text x="464" y="244" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#52606d">drop the monitor</text>
<text x="464" y="266" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#147d64">return Ok</text>

<rect x="558" y="182" width="164" height="96" rx="5" fill="#fff1e6" stroke="#b54708" stroke-width="1.6"/>
<text x="640" y="206" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#17212b">Err(error)</text>
<text x="640" y="226" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#52606d">drain accepted output</text>
<text x="640" y="244" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#52606d">original error stays primary</text>
<text x="640" y="266" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#b54708">return Err</text>

<line x1="360" y1="166" x2="115" y2="182" stroke="#65758b" stroke-width="1.5" marker-end="url(#architecture-owner-loop-arrow)"/>
<line x1="374" y1="166" x2="288" y2="182" stroke="#65758b" stroke-width="1.5" marker-end="url(#architecture-owner-loop-arrow)"/>
<line x1="388" y1="166" x2="464" y2="182" stroke="#65758b" stroke-width="1.5" marker-end="url(#architecture-owner-loop-arrow)"/>
<line x1="400" y1="166" x2="636" y2="182" stroke="#65758b" stroke-width="1.5" marker-end="url(#architecture-owner-loop-arrow)"/>

<path d="M 115 278 L 115 322 L 288 322 L 288 278" fill="none" stroke="#147d64" stroke-width="1.8"/>
<path d="M 201 322 L 201 356 L 700 356 L 700 92 L 552 92" fill="none" stroke="#147d64" stroke-width="1.8" marker-end="url(#architecture-owner-loop-loop)"/>
<text x="330" y="348" text-anchor="start" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#147d64">continue the loop — the same loop, never a second generation</text>

<rect x="40" y="392" width="682" height="82" rx="6" fill="#f7f9fb" stroke="#a8b3bf" stroke-width="1.4"/>
<text x="60" y="416" text-anchor="start" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#17212b">Invariant across every iteration</text>
<text x="60" y="438" text-anchor="start" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#52606d">Exactly one active DataflowMonitor, one ReconfigurableInputStream generation, and one OutputWriter.</text>
<text x="60" y="458" text-anchor="start" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#52606d">A replacement is a local value installed serially; it is never a staged generation held alongside the active one.</text>

<text x="24" y="512" text-anchor="start" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#52606d">Refreshing the revision after each data batch is not bookkeeping noise: a nested dynamic or defer replacement advances the</text>
<text x="24" y="530" text-anchor="start" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#52606d">monitor's revision during an ordinary tick, and the next root command must be validated against the revision actually active.</text>
<text x="24" y="560" text-anchor="start" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#52606d">Terminal exits flush and close the writer first, so accepted rows drain where the backend permits.</text>
</svg>
