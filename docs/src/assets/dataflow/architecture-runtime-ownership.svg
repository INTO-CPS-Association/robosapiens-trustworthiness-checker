<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 930" role="img" aria-labelledby="architecture-ownership-title architecture-ownership-desc" style="width:100%;max-width:850px;height:auto;background:#ffffff;border:1px solid #d0d7de;border-radius:6px">
<title id="architecture-ownership-title">DataflowMonitor runtime ownership</title>
<desc id="architecture-ownership-desc">DataflowMonitor directly owns the immutable MonitorPlan, mutable ReconfigurationState and Scheduler, current and optional retained environment rows, and MonitorExecution. MonitorExecution owns a fixed EvaluatorArena and an ExecutionEngine. The arena contains persistent evaluators and canonical state. The engine owns one active PlanBundle, up to four cached PlanBundles, and the JIT coordinator.</desc>
<defs>
  <marker id="architecture-ownership-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#65758b"/>
  </marker>
</defs>
<text x="24" y="29" text-anchor="start" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#17212b">State stays with the monitor; schedules own routing only</text>
<rect x="20" y="45" width="810" height="855" rx="8" fill="#f7f9fb" stroke="#a8b3bf" stroke-width="1.5"/>
<rect x="225" y="72" width="400" height="66" rx="5" fill="#f3ebf8" stroke="#8055a3" stroke-width="1.5"/>
<text x="425" y="103" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">DataflowMonitor</text>
<text x="425" y="122" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">compiled, stateful synchronous machine</text>
<text x="425" y="158" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#52606d">directly owns</text>
<path d="M 425 138 L 425 171 L 207 171 L 207 190" fill="none" stroke="#65758b" stroke-width="1.8" marker-end="url(#architecture-ownership-arrow)"/>
<path d="M 425 138 L 425 171 L 642 171 L 642 190" fill="none" stroke="#65758b" stroke-width="1.8" marker-end="url(#architecture-ownership-arrow)"/>
<rect x="55" y="190" width="305" height="74" rx="5" fill="#e6f5f0" stroke="#147d64" stroke-width="1.5"/>
<text x="207" y="222" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">immutable MonitorPlan</text>
<text x="207" y="242" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">slots, static edges, reconfiguration</text>
<rect x="490" y="190" width="305" height="74" rx="5" fill="#fff1e6" stroke="#b54708" stroke-width="1.5"/>
<text x="642" y="222" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">ReconfigurationState</text>
<text x="642" y="242" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">live points, source ranges, sealing</text>
<path d="M 425 171 L 425 283 L 207 283 L 207 302" fill="none" stroke="#65758b" stroke-width="1.8" marker-end="url(#architecture-ownership-arrow)"/>
<path d="M 425 171 L 425 283 L 642 283 L 642 302" fill="none" stroke="#65758b" stroke-width="1.8" marker-end="url(#architecture-ownership-arrow)"/>
<rect x="55" y="302" width="305" height="74" rx="5" fill="#fff1e6" stroke="#b54708" stroke-width="1.5"/>
<text x="207" y="334" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">Scheduler</text>
<text x="207" y="354" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">active edges + dependency order</text>
<rect x="490" y="302" width="305" height="74" rx="5" fill="#e8f1fb" stroke="#2563a6" stroke-width="1.5"/>
<text x="642" y="329" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">environment rows</text>
<text x="642" y="348" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">current row + optional retained row</text>
<text x="642" y="365" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#52606d">stable EnvironmentSlots</text>
<path d="M 425 171 L 425 415" fill="none" stroke="#65758b" stroke-width="1.8" marker-end="url(#architecture-ownership-arrow)"/>
<rect x="225" y="415" width="400" height="66" rx="5" fill="#f3ebf8" stroke="#8055a3" stroke-width="1.5"/>
<text x="425" y="446" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">MonitorExecution</text>
<text x="425" y="465" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">execution state and tier-selection boundary</text>
<path d="M 425 481 L 425 515 L 207 515 L 207 535" fill="none" stroke="#65758b" stroke-width="1.8" marker-end="url(#architecture-ownership-arrow)"/>
<path d="M 425 481 L 425 515 L 642 515 L 642 535" fill="none" stroke="#65758b" stroke-width="1.8" marker-end="url(#architecture-ownership-arrow)"/>
<rect x="55" y="535" width="305" height="100" rx="5" fill="#e6f5f0" stroke="#147d64" stroke-width="1.5"/>
<text x="207" y="566" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">fixed EvaluatorArena</text>
<text x="207" y="587" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">StreamEvaluator[] + published scalars</text>
<text x="207" y="606" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">persistent StreamState per StreamId</text>
<text x="207" y="624" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#52606d">canonical language state lives here</text>
<rect x="490" y="535" width="305" height="100" rx="5" fill="#fff1e6" stroke="#b54708" stroke-width="1.5"/>
<text x="642" y="566" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">ExecutionEngine</text>
<text x="642" y="587" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">selects schedule and physical tier</text>
<text x="642" y="606" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">increments stable PlanId values</text>
<text x="642" y="624" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#52606d">owns no canonical evaluator state</text>
<line x1="207" y1="635" x2="207" y2="682" stroke="#65758b" stroke-width="1.8" marker-end="url(#architecture-ownership-arrow)"/>
<rect x="70" y="682" width="275" height="76" rx="5" fill="#f3ebf8" stroke="#8055a3" stroke-width="1.5"/>
<text x="207" y="713" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">persistent evaluator state</text>
<text x="207" y="733" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">delays, branches, calls, dynamic</text>
<text x="207" y="750" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#52606d">survives schedule replacement</text>
<path d="M 642 635 L 642 666 L 480 666 L 480 690" fill="none" stroke="#65758b" stroke-width="1.8" marker-end="url(#architecture-ownership-arrow)"/>
<path d="M 642 635 L 642 666 L 705 666 L 705 690" fill="none" stroke="#65758b" stroke-width="1.8" marker-end="url(#architecture-ownership-arrow)"/>
<rect x="380" y="690" width="200" height="76" rx="5" fill="#f3ebf8" stroke="#8055a3" stroke-width="1.5"/>
<text x="480" y="721" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">active PlanBundle</text>
<text x="480" y="741" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">semantic + quick views</text>
<text x="480" y="758" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#52606d">current schedule only</text>
<rect x="605" y="690" width="200" height="76" rx="5" fill="#f3ebf8" stroke="#8055a3" stroke-width="1.5"/>
<text x="705" y="721" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">cached PlanBundles</text>
<text x="705" y="741" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">up to four previous</text>
<text x="705" y="758" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#52606d">routing artifacts only</text>
<path d="M 642 635 L 820 635 L 820 839 L 795 839" fill="none" stroke="#65758b" stroke-width="1.8" marker-end="url(#architecture-ownership-arrow)"/>
<rect x="490" y="806" width="305" height="66" rx="5" fill="#e8f1fb" stroke="#2563a6" stroke-width="1.5"/>
<text x="642" y="837" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">Jit</text>
<text x="642" y="856" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">owns compiled native artifacts</text>
</svg>
