<svg class="tc-figure" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 556" role="img" aria-labelledby="t3 d3" style="width:100%; max-width:1000px; height:auto; background:var(--fig-bg);">
<title id="t3">One partition, drawn on the graph and on the schedule</title>
<desc id="d3">Ten computed streams. Each region is drawn around the streams it covers in the dataflow graph, and again below over the scheduler order, linked by a numbered badge. Three stream regions cover several streams each; three graph steps sit between them, one with an interleaved interior, one a single island, one with no islands at all.</desc>
