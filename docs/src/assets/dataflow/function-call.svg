<rect x="25" y="48" width="910" height="190" rx="8" fill="var(--fig-panel)" stroke="var(--fig-panel-line)"/>
<text x="45" y="77" text-anchor="start" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="var(--fig-ink)">Normal Apply: call-site state continues</text>
<text x="205" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="var(--fig-ink-2)">logical tick n</text>
<text x="700" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="var(--fig-ink-2)">logical tick n + 1</text>
<rect x="45" y="125" width="150" height="52" rx="5" fill="var(--fig-blue)" stroke="var(--fig-blue-line)" stroke-width="1.5"/>
