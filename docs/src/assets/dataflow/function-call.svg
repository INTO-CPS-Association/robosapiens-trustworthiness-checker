<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" role="img" aria-labelledby="function-call-arrow-title function-call-arrow-desc" style="width:100%;max-width:960px;height:auto;background:#ffffff;border:1px solid #d0d7de;border-radius:6px">
<title id="function-call-arrow-title">Normal Apply state continuation and recursive frame evaluation</title>
<desc id="function-call-arrow-desc">Normal Apply retains one callable instance while function identity F1 remains active. Its evaluator state advances from S n on one logical tick to S n plus one on the next; a different function identity creates fresh callable state. RecursiveApply creates a RecursiveCall with current captures and a shared program. Each active recursion depth acquires a separate frame, fills different arguments, resets its evaluator, and evaluates. Frames return to the available pool as recursion unwinds.</desc>
<defs>
  <marker id="function-call-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#65758b"/>
  </marker>
</defs>
<text x="24" y="27" text-anchor="start" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#17212b">Normal and recursive function evaluation</text>
<rect x="25" y="48" width="910" height="190" rx="8" fill="#f7f9fb" stroke="#a8b3bf"/>
<text x="45" y="77" text-anchor="start" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#17212b">Normal Apply: call-site state continues</text>
<text x="205" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">logical tick n</text>
<text x="700" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">logical tick n + 1</text>
<rect x="45" y="125" width="150" height="52" rx="5" fill="#e8f1fb" stroke="#2563a6" stroke-width="1.5"/>
<text x="120" y="156" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">F1(args)</text>
<rect x="235" y="112" width="210" height="78" rx="5" fill="#e8f1fb" stroke="#2563a6" stroke-width="1.5"/>
<text x="340" y="149" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">callable F1</text>
<text x="340" y="167" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">state S(n)</text>
<line x1="195" y1="151" x2="235" y2="151" stroke="#65758b" stroke-width="1.8" marker-end="url(#function-call-arrow)"/>
<rect x="555" y="125" width="150" height="52" rx="5" fill="#e8f1fb" stroke="#2563a6" stroke-width="1.5"/>
<text x="630" y="156" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">F1(args')</text>
<rect x="745" y="112" width="165" height="78" rx="5" fill="#e6f5f0" stroke="#147d64" stroke-width="1.5"/>
<text x="827" y="149" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">same callable F1</text>
<text x="827" y="167" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">state S(n + 1)</text>
<line x1="705" y1="151" x2="745" y2="151" stroke="#65758b" stroke-width="1.8" marker-end="url(#function-call-arrow)"/>
<path d="M 445 175 C 520 220, 670 220, 745 175" fill="none" stroke="#147d64" stroke-width="2" marker-end="url(#function-call-arrow)"/>
<text x="595" y="218" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">callable state</text>
<rect x="25" y="258" width="910" height="300" rx="8" fill="#f7f9fb" stroke="#a8b3bf"/>
<text x="45" y="287" text-anchor="start" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#17212b">RecursiveApply: reset frame at each call depth</text>
<rect x="45" y="330" width="205" height="76" rx="5" fill="#fff1e6" stroke="#b54708" stroke-width="1.5"/>
<text x="147" y="366" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">RecursiveCall</text>
<text x="147" y="384" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">captures + shared program</text>
<line x1="250" y1="368" x2="365" y2="374" stroke="#65758b" stroke-width="1.8" marker-end="url(#function-call-arrow)"/>
<rect x="325" y="310" width="300" height="225" rx="7" fill="#fff1e6" stroke="#b54708" stroke-width="1.5"/>
<text x="345" y="335" text-anchor="start" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">active call stack</text>
<rect x="365" y="350" width="220" height="48" rx="5" fill="#f7f9fb" stroke="#a8b3bf" stroke-width="1.5"/>
<text x="475" y="372" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">frame 0</text>
<text x="475" y="390" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">args: n</text>
<rect x="365" y="415" width="220" height="48" rx="5" fill="#f7f9fb" stroke="#a8b3bf" stroke-width="1.5"/>
<text x="475" y="437" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">frame 1</text>
<text x="475" y="455" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">args: n - 1</text>
<rect x="365" y="480" width="220" height="42" rx="5" fill="#f7f9fb" stroke="#a8b3bf" stroke-width="1.5"/>
<text x="475" y="499" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">frame 2</text>
<text x="475" y="517" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">base case</text>
<line x1="475" y1="398" x2="475" y2="415" stroke="#65758b" stroke-width="1.8" marker-end="url(#function-call-arrow)"/>
<line x1="475" y1="463" x2="475" y2="480" stroke="#65758b" stroke-width="1.8" marker-end="url(#function-call-arrow)"/>
<rect x="700" y="365" width="190" height="76" rx="5" fill="#e6f5f0" stroke="#147d64" stroke-width="1.5"/>
<text x="795" y="401" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">available frame pool</text>
<text x="795" y="419" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">after unwind</text>
<path d="M 625 500 C 680 500, 680 420, 700 403" fill="none" stroke="#65758b" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#function-call-arrow)"/>
</svg>
