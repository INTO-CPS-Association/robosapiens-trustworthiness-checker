<path d="M 445 175 C 520 220, 670 220, 745 175" fill="none" stroke="var(--fig-green-line)" stroke-width="2" marker-end="url(#function-call-arrow)"/>
<text x="595" y="228" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="var(--fig-ink-2)">callable state</text>
<rect x="25" y="258" width="910" height="300" rx="8" fill="var(--fig-panel)" stroke="var(--fig-panel-line)"/>
<text x="45" y="287" text-anchor="start" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="var(--fig-ink)">RecursiveApply: reset frame at each call depth</text>
<rect x="45" y="330" width="205" height="76" rx="5" fill="var(--fig-orange)" stroke="var(--fig-orange-line)" stroke-width="1.5"/>
