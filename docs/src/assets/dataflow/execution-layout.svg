<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 455" role="img" aria-labelledby="layout-arrow-title layout-arrow-desc" style="width:100%;max-width:1030px;height:auto;background:#ffffff;border:1px solid #d0d7de;border-radius:6px">
  <title id="layout-arrow-title">A PlanBundle routes a scheduled order into stable evaluators</title>
  <desc id="layout-arrow-desc">MonitorPlan metadata and the active Scheduler order produce a ScheduledExecutionPlan. The execution engine packages that semantic plan with a QuickPlan in the active PlanBundle and may retain four previous bundles in its cache. For the running example, the quick route contains a ScalarRun for scaled, a Graph step for total, and a ScalarRun for alert. These steps address the stable Evaluator owners for scaled, total, and alert; route replacement does not move their language state. JIT coordination observes PlanId separately and is not represented as part of QuickPlan.</desc>
  <defs><marker id="layout-arrow" markerWidth="7" markerHeight="7" refX="9" refY="5" viewBox="0 0 10 10" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 10 5 L 0 10 z" fill="#65758b"/></marker></defs>
  <text x="24" y="30" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#17212b">Schedule-specific routing, stable evaluator ownership</text>
  <rect x="30" y="52" width="245" height="70" rx="5" fill="#e8f1fb" stroke="#2563a6" stroke-width="1.5"/>
  <text x="152" y="82" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">MonitorPlan metadata</text><text x="152" y="102" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#52606d">programs, slots, effects, dependencies</text>
  <rect x="392" y="52" width="245" height="70" rx="5" fill="#fff1e6" stroke="#b54708" stroke-width="1.5"/>
  <text x="514" y="82" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">Scheduler order</text><text x="514" y="102" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#52606d">source range + main range</text>
  <rect x="755" y="52" width="245" height="70" rx="5" fill="#f3ebf8" stroke="#8055a3" stroke-width="1.5"/>
  <text x="877" y="82" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">ScheduledExecutionPlan</text><text x="877" y="102" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#52606d">semantic order + PlanId</text>
  <path d="M 275 87 H 392" fill="none" stroke="#65758b" stroke-width="1.6" marker-end="url(#layout-arrow)"/><path d="M 637 87 H 755" fill="none" stroke="#65758b" stroke-width="1.6" marker-end="url(#layout-arrow)"/>

  <rect x="30" y="155" width="970" height="130" rx="7" fill="#f7f9fb" stroke="#a8b3bf" stroke-width="1.5"/>
  <text x="50" y="182" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#17212b">active PlanBundle</text>
  <text x="980" y="182" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#52606d">plus at most four previous cached PlanBundles</text>
  <rect x="65" y="202" width="250" height="58" rx="5" fill="#e6f5f0" stroke="#147d64" stroke-width="1.5"/>
  <text x="190" y="226" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#17212b">ScalarRun [scaled]</text><text x="190" y="245" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#52606d">complete one-node stream</text>
  <rect x="390" y="202" width="250" height="58" rx="5" fill="#fff1e6" stroke="#b54708" stroke-width="1.5"/>
  <text x="515" y="226" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#17212b">Graph [total]</text><text x="515" y="245" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#52606d">canonical or mixed node plan</text>
  <rect x="715" y="202" width="250" height="58" rx="5" fill="#e6f5f0" stroke="#147d64" stroke-width="1.5"/>
  <text x="840" y="226" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#17212b">ScalarRun [alert]</text><text x="840" y="245" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#52606d">reads published total</text>
  <path d="M 315 231 H 390" fill="none" stroke="#65758b" stroke-width="1.6" marker-end="url(#layout-arrow)"/><path d="M 640 231 H 715" fill="none" stroke="#65758b" stroke-width="1.6" marker-end="url(#layout-arrow)"/>

  <text x="30" y="324" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#17212b">stable evaluator owners</text>
  <rect x="65" y="342" width="250" height="70" rx="5" fill="#e8f1fb" stroke="#2563a6" stroke-width="1.5"/>
  <text x="190" y="372" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">Evaluator(scaled)</text><text x="190" y="392" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#52606d">canonical + quickened state</text>
  <rect x="390" y="342" width="250" height="70" rx="5" fill="#e8f1fb" stroke="#2563a6" stroke-width="1.5"/>
  <text x="515" y="372" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">Evaluator(total)</text><text x="515" y="392" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#52606d">delay, default, add state</text>
  <rect x="715" y="342" width="250" height="70" rx="5" fill="#e8f1fb" stroke="#2563a6" stroke-width="1.5"/>
  <text x="840" y="372" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">Evaluator(alert)</text><text x="840" y="392" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#52606d">canonical + quickened state</text>
  <g fill="none" stroke="#65758b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#layout-arrow)"><path d="M 190 260 V 342"/><path d="M 515 260 V 342"/><path d="M 840 260 V 342"/></g>
  <text x="515" y="440" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#52606d">JIT coordination is a separate PlanId-aware tier; it does not become QuickPlan state</text>
</svg>
