<svg class="tc-figure" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 455" role="img" aria-labelledby="layout-arrow-title layout-arrow-desc" style="width:100%;max-width:1030px;height:auto;background:var(--fig-bg);border:1px solid var(--fig-edge);border-radius:6px">
  <title id="layout-arrow-title">An ExecutionPlan routes a scheduled order into stable evaluators</title>
  <desc id="layout-arrow-desc">MonitorPlan metadata and the active Scheduler order produce a ScheduledExecutionPlan. The execution engine partitions that semantic plan into an ExecutionPlan of steps, and may retain four previous plans in its cache. For the running example the steps are a ScalarRegion for scaled, a Graph step for total because it carries temporal state, and a ScalarRegion for alert. These steps address the stable Evaluator owners for scaled, total, and alert. Each evaluator holds canonical state only; the quickened register state for a region sits beside the arena in the execution plan, not inside the evaluator, which is why replacing a route does not move language state. JIT coordination observes PlanId separately.</desc>
  <!--
    Theme tokens. In the book these are overridden per theme by theme/diagram-theme.css; this block
    is the fallback that keeps the figure readable standalone, as an image, and when rustdoc inlines
    it with include_str!. Scoped to .tc-figure, never :root, so inlining cannot leak the names.
  -->
  <style>
    .tc-figure {
      --fig-bg: #ffffff;
      --fig-edge: #d0d7de;
      --fig-ink: #17212b;
      --fig-ink-2: #52606d;
      --fig-line: #65758b;
      --fig-panel: #f7f9fb;
      --fig-panel-line: #a8b3bf;
      --fig-blue: #e8f1fb;
      --fig-blue-line: #2563a6;
      --fig-green: #e6f5f0;
      --fig-green-line: #147d64;
      --fig-orange: #fff1e6;
      --fig-orange-line: #b54708;
      --fig-purple: #f3ebf8;
      --fig-purple-line: #8055a3;
      --fig-source: #eef6ff;
      --fig-source-line: #3478b8;
      --fig-redis: #fff5e8;
      --fig-redis-line: #bc6b16;
      --fig-checker: #f1ecff;
      --fig-checker-line: #7254b3;
      --fig-knowledge: #eaf8ee;
      --fig-knowledge-line: #39834d;
    }
    @media (prefers-color-scheme: dark) {
      .tc-figure {
        --fig-bg: #171b26;
        --fig-edge: #333a4d;
        --fig-ink: #e6e9f0;
        --fig-ink-2: #a2acbd;
        --fig-line: #8492a6;
        --fig-panel: #1e2432;
        --fig-panel-line: #3d465c;
        --fig-blue: #16283d;
        --fig-blue-line: #6aa9e0;
        --fig-green: #123029;
        --fig-green-line: #4fbfa0;
        --fig-orange: #33240f;
        --fig-orange-line: #e0a44e;
        --fig-purple: #241c33;
        --fig-purple-line: #b18fd4;
        --fig-source: #14283c;
        --fig-source-line: #6fa8db;
        --fig-redis: #33260f;
        --fig-redis-line: #d99a3f;
        --fig-checker: #241d34;
        --fig-checker-line: #a892d6;
        --fig-knowledge: #132c1c;
        --fig-knowledge-line: #5fae74;
      }
    }
  </style>
  <defs><marker id="layout-arrow" markerWidth="7" markerHeight="7" refX="9" refY="5" viewBox="0 0 10 10" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--fig-line)"/></marker></defs>
  <text x="24" y="30" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="var(--fig-ink)">Schedule-specific routing, stable evaluator ownership</text>
  <rect x="30" y="52" width="245" height="70" rx="5" fill="var(--fig-blue)" stroke="var(--fig-blue-line)" stroke-width="1.5"/>
  <text x="152" y="82" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="var(--fig-ink)">MonitorPlan metadata</text><text x="152" y="102" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="var(--fig-ink-2)">programs, slots, effects, dependencies</text>
  <rect x="392" y="52" width="245" height="70" rx="5" fill="var(--fig-orange)" stroke="var(--fig-orange-line)" stroke-width="1.5"/>
  <text x="514" y="82" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="var(--fig-ink)">Scheduler order</text><text x="514" y="102" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="var(--fig-ink-2)">source range + main range</text>
  <rect x="755" y="52" width="245" height="70" rx="5" fill="var(--fig-purple)" stroke="var(--fig-purple-line)" stroke-width="1.5"/>
  <text x="877" y="82" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="var(--fig-ink)">ScheduledExecutionPlan</text><text x="877" y="102" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="var(--fig-ink-2)">semantic order + PlanId</text>
  <path d="M 275 87 H 392" fill="none" stroke="var(--fig-line)" stroke-width="1.6" marker-end="url(#layout-arrow)"/><path d="M 637 87 H 755" fill="none" stroke="var(--fig-line)" stroke-width="1.6" marker-end="url(#layout-arrow)"/>
  <rect x="30" y="155" width="970" height="130" rx="7" fill="var(--fig-panel)" stroke="var(--fig-panel-line)" stroke-width="1.5"/>
  <text x="50" y="182" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="var(--fig-ink)">active ExecutionPlan</text>
  <text x="980" y="182" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="var(--fig-ink-2)">plus at most four cached inactive plans</text>
  <rect x="65" y="202" width="250" height="58" rx="5" fill="var(--fig-green)" stroke="var(--fig-green-line)" stroke-width="1.5"/>
  <text x="190" y="226" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="var(--fig-ink)">ScalarRegion [scaled]</text><text x="190" y="245" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="var(--fig-ink-2)">complete one-node stream</text>
  <rect x="390" y="202" width="250" height="58" rx="5" fill="var(--fig-orange)" stroke="var(--fig-orange-line)" stroke-width="1.5"/>
  <text x="515" y="226" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="var(--fig-ink)">Graph [total]</text><text x="515" y="245" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="var(--fig-ink-2)">temporal state keeps it canonical</text>
  <rect x="715" y="202" width="250" height="58" rx="5" fill="var(--fig-green)" stroke="var(--fig-green-line)" stroke-width="1.5"/>
  <text x="840" y="226" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="var(--fig-ink)">ScalarRegion [alert]</text><text x="840" y="245" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="var(--fig-ink-2)">reads published total</text>
  <path d="M 315 231 H 390" fill="none" stroke="var(--fig-line)" stroke-width="1.6" marker-end="url(#layout-arrow)"/><path d="M 640 231 H 715" fill="none" stroke="var(--fig-line)" stroke-width="1.6" marker-end="url(#layout-arrow)"/>
  <text x="30" y="324" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="var(--fig-ink)">stable evaluator owners</text>
  <rect x="65" y="342" width="250" height="70" rx="5" fill="var(--fig-blue)" stroke="var(--fig-blue-line)" stroke-width="1.5"/>
  <text x="190" y="372" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="var(--fig-ink)">Evaluator(scaled)</text><text x="190" y="392" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="var(--fig-ink-2)">canonical state only</text>
  <rect x="390" y="342" width="250" height="70" rx="5" fill="var(--fig-blue)" stroke="var(--fig-blue-line)" stroke-width="1.5"/>
  <text x="515" y="372" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="var(--fig-ink)">Evaluator(total)</text><text x="515" y="392" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="var(--fig-ink-2)">delay, default, add state</text>
  <rect x="715" y="342" width="250" height="70" rx="5" fill="var(--fig-blue)" stroke="var(--fig-blue-line)" stroke-width="1.5"/>
  <text x="840" y="372" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="var(--fig-ink)">Evaluator(alert)</text><text x="840" y="392" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="var(--fig-ink-2)">canonical state only</text>
  <g fill="none" stroke="var(--fig-line)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#layout-arrow)"><path d="M 190 260 V 342"/><path d="M 515 260 V 342"/><path d="M 840 260 V 342"/></g>
  <text x="515" y="440" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="var(--fig-ink-2)">Region state lives with the plan, not the evaluator; JIT coordination observes PlanId separately</text>
</svg>
