<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1120" role="img" aria-labelledby="architecture-dynamic-tick-title architecture-dynamic-tick-desc" style="width:100%;max-width:800px;height:auto;background:#ffffff;border:1px solid #d0d7de;border-radius:6px">
<title id="architecture-dynamic-tick-title">Dynamic monitor tick with source and main ranges</title>
<desc id="architecture-dynamic-tick-desc">A dynamic tick clears the current row, loads inputs, and updates retained inputs. It evaluates the source range, resolves live dynamic and unsealed defer points, updates exact active dependencies, and repairs a dirty order only when required. It then evaluates the disjoint main range, commits temporal state exactly once, applies pending defer sealing for the next tick, and projects outputs.</desc>
<defs>
  <marker id="architecture-dynamic-tick-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#65758b"/>
  </marker>
</defs>
<text x="24" y="29" text-anchor="start" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#17212b">Dynamic tick: resolve dependencies before the main range</text>
<rect x="140" y="55" width="520" height="78" rx="5" fill="#e8f1fb" stroke="#2563a6" stroke-width="1.5"/>
<text x="400" y="87" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">1  clear current row + load inputs</text>
<text x="400" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">reset to NoVal; refresh retained inputs on new values</text>
<text x="400" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#52606d">input slots are available before source evaluation</text>
<line x1="400" y1="133" x2="400" y2="168" stroke="#65758b" stroke-width="1.8" marker-end="url(#architecture-dynamic-tick-arrow)"/>
<rect x="140" y="168" width="520" height="78" rx="5" fill="#e6f5f0" stroke="#147d64" stroke-width="1.5"/>
<text x="400" y="200" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">2  evaluate source range</text>
<text x="400" y="221" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">only computed prerequisites of live expression sources</text>
<text x="400" y="238" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#52606d">each source-range stream evaluates once</text>
<line x1="400" y1="246" x2="400" y2="281" stroke="#65758b" stroke-width="1.8" marker-end="url(#architecture-dynamic-tick-arrow)"/>
<rect x="140" y="281" width="520" height="88" rx="5" fill="#fff1e6" stroke="#b54708" stroke-width="1.5"/>
<text x="400" y="313" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">3  resolve reconfiguration points</text>
<text x="400" y="334" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">read every dynamic source and each unsealed defer source</text>
<text x="400" y="353" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#52606d">activate or replace nested evaluators; queue defer releases</text>
<line x1="400" y1="369" x2="400" y2="404" stroke="#65758b" stroke-width="1.8" marker-end="url(#architecture-dynamic-tick-arrow)"/>
<rect x="140" y="404" width="520" height="82" rx="5" fill="#fff1e6" stroke="#b54708" stroke-width="1.5"/>
<text x="400" y="436" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">4  update exact active dependencies</text>
<text x="400" y="457" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">rebuild changed dependency-slot unions</text>
<text x="400" y="475" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#52606d">mark order dirty only for an unsatisfied new edge</text>
<line x1="400" y1="486" x2="400" y2="521" stroke="#65758b" stroke-width="1.8" marker-end="url(#architecture-dynamic-tick-arrow)"/>
<rect x="260" y="521" width="280" height="68" rx="5" fill="#f3ebf8" stroke="#8055a3" stroke-width="1.5"/>
<text x="400" y="552" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">dependency order dirty?</text>
<text x="400" y="571" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">cycle-safe decision point</text>
<path d="M 260 555 L 100 555 L 100 627 L 205 627" fill="none" stroke="#65758b" stroke-width="1.8" marker-end="url(#architecture-dynamic-tick-arrow)"/>
<text x="151" y="546" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#52606d">yes</text>
<path d="M 540 555 L 700 555 L 700 763 L 660 763" fill="none" stroke="#65758b" stroke-width="1.8" marker-end="url(#architecture-dynamic-tick-arrow)"/>
<text x="650" y="546" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#52606d">no</text>
<rect x="205" y="609" width="390" height="78" rx="5" fill="#fff1e6" stroke="#b54708" stroke-width="1.5"/>
<text x="400" y="641" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">5  repair order when required</text>
<text x="400" y="662" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">merge static + active edges; reject runtime cycles</text>
<text x="400" y="679" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#52606d">select or build the matching schedule PlanBundle</text>
<line x1="400" y1="687" x2="400" y2="722" stroke="#65758b" stroke-width="1.8" marker-end="url(#architecture-dynamic-tick-arrow)"/>
<rect x="140" y="722" width="520" height="82" rx="5" fill="#e6f5f0" stroke="#147d64" stroke-width="1.5"/>
<text x="400" y="754" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">6  evaluate disjoint main range</text>
<text x="400" y="775" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">run every stream not already in the source range</text>
<text x="400" y="793" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#52606d">quickened, canonical, or per-stream JIT execution</text>
<line x1="400" y1="804" x2="400" y2="839" stroke="#65758b" stroke-width="1.8" marker-end="url(#architecture-dynamic-tick-arrow)"/>
<rect x="140" y="839" width="520" height="76" rx="5" fill="#e6f5f0" stroke="#147d64" stroke-width="1.5"/>
<text x="400" y="871" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">7  commit temporal state once</text>
<text x="400" y="892" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">one boundary across source and main ranges</text>
<line x1="400" y1="915" x2="400" y2="950" stroke="#65758b" stroke-width="1.8" marker-end="url(#architecture-dynamic-tick-arrow)"/>
<rect x="140" y="950" width="520" height="76" rx="5" fill="#fff1e6" stroke="#b54708" stroke-width="1.5"/>
<text x="400" y="982" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">8  apply pending defer sealing</text>
<text x="400" y="1003" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">release prerequisites only for the next tick's ranges</text>
<line x1="400" y1="1026" x2="400" y2="1052" stroke="#65758b" stroke-width="1.8" marker-end="url(#architecture-dynamic-tick-arrow)"/>
<rect x="225" y="1052" width="350" height="48" rx="5" fill="#e8f1fb" stroke="#2563a6" stroke-width="1.5"/>
<text x="400" y="1081" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">9  project outputs</text>
</svg>
