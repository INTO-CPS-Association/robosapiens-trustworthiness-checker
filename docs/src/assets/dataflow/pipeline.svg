<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="pipeline-arrow-title pipeline-arrow-desc" style="width:100%;max-width:1000px;height:auto;background:#ffffff;border:1px solid #d0d7de;border-radius:6px">
<title id="pipeline-arrow-title">Current dataflow compilation and tick pipeline</title>
<desc id="pipeline-arrow-desc">Compilation lowers EvaluationGraphs, binds EnvironmentSlots into StreamPrograms, and creates a DataflowMonitor with a MonitorPlan, Scheduler, and persistent stream evaluators. Each tick loads inputs, pre-evaluates expression sources, resolves active programs, validates the schedule, evaluates every remaining stream once in active dependency order, commits temporal state, and projects outputs.</desc>
<defs>
  <marker id="pipeline-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#65758b"/>
  </marker>
</defs>
<text x="24" y="27" text-anchor="start" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#17212b">Compile once</text>
<rect x="35" y="52" width="190" height="64" rx="5" fill="#e8f1fb" stroke="#2563a6" stroke-width="1.5"/>
<text x="130" y="82" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">DSRV specification</text>
<text x="130" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">typed or untyped</text>
<rect x="280" y="52" width="190" height="64" rx="5" fill="#e6f5f0" stroke="#147d64" stroke-width="1.5"/>
<text x="375" y="82" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">LoweredDataflow</text>
<text x="375" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">EvaluationGraph + dependencies</text>
<rect x="525" y="52" width="190" height="64" rx="5" fill="#fff1e6" stroke="#b54708" stroke-width="1.5"/>
<text x="620" y="82" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">StreamProgram</text>
<text x="620" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">bind EnvironmentSlot refs</text>
<rect x="770" y="52" width="190" height="64" rx="5" fill="#f3ebf8" stroke="#8055a3" stroke-width="1.5"/>
<text x="865" y="82" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">DataflowMonitor</text>
<text x="865" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">ordered persistent machine</text>
<line x1="225" y1="84" x2="280" y2="84" stroke="#65758b" stroke-width="1.8" marker-end="url(#pipeline-arrow)"/>
<line x1="470" y1="84" x2="525" y2="84" stroke="#65758b" stroke-width="1.8" marker-end="url(#pipeline-arrow)"/>
<line x1="715" y1="84" x2="770" y2="84" stroke="#65758b" stroke-width="1.8" marker-end="url(#pipeline-arrow)"/>
<line x1="25" y1="145" x2="975" y2="145" stroke="#a8b3bf" stroke-width="1"/>
<text x="24" y="176" text-anchor="start" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#17212b">Every logical tick</text>
<rect x="35" y="202" width="205" height="64" rx="5" fill="#e8f1fb" stroke="#2563a6" stroke-width="1.5"/>
<text x="137" y="232" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">1  load inputs</text>
<text x="137" y="250" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">environment row</text>
<rect x="275" y="202" width="205" height="64" rx="5" fill="#e8f1fb" stroke="#2563a6" stroke-width="1.5"/>
<text x="377" y="232" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">2  evaluate sources</text>
<text x="377" y="250" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">MonitorPlan source order</text>
<rect x="515" y="202" width="205" height="64" rx="5" fill="#e8f1fb" stroke="#2563a6" stroke-width="1.5"/>
<text x="617" y="232" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">3  resolve programs</text>
<text x="617" y="250" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">exact active dependencies</text>
<rect x="755" y="202" width="205" height="64" rx="5" fill="#e8f1fb" stroke="#2563a6" stroke-width="1.5"/>
<text x="857" y="232" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">4  validate schedule</text>
<text x="857" y="250" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">Scheduler repairs if needed</text>
<rect x="155" y="308" width="205" height="64" rx="5" fill="#e6f5f0" stroke="#147d64" stroke-width="1.5"/>
<text x="257" y="338" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">5  evaluate once</text>
<text x="257" y="356" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">active dependency order</text>
<rect x="395" y="308" width="205" height="64" rx="5" fill="#e6f5f0" stroke="#147d64" stroke-width="1.5"/>
<text x="497" y="338" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">6  commit temporal</text>
<text x="497" y="356" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">post-row staged writes</text>
<rect x="635" y="308" width="205" height="64" rx="5" fill="#e6f5f0" stroke="#147d64" stroke-width="1.5"/>
<text x="737" y="338" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">7  project outputs</text>
<text x="737" y="356" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">saved EnvironmentSlots</text>
<line x1="240" y1="234" x2="275" y2="234" stroke="#65758b" stroke-width="1.8" marker-end="url(#pipeline-arrow)"/>
<line x1="480" y1="234" x2="515" y2="234" stroke="#65758b" stroke-width="1.8" marker-end="url(#pipeline-arrow)"/>
<line x1="720" y1="234" x2="755" y2="234" stroke="#65758b" stroke-width="1.8" marker-end="url(#pipeline-arrow)"/>
<path d="M 857 266 C 857 290, 257 290, 257 308" fill="none" stroke="#65758b" stroke-width="1.8" marker-end="url(#pipeline-arrow)"/>
<line x1="360" y1="340" x2="395" y2="340" stroke="#65758b" stroke-width="1.8" marker-end="url(#pipeline-arrow)"/>
<line x1="600" y1="340" x2="635" y2="340" stroke="#65758b" stroke-width="1.8" marker-end="url(#pipeline-arrow)"/>
</svg>
