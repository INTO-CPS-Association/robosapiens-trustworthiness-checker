<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 850" role="img" aria-labelledby="architecture-static-tick-title architecture-static-tick-desc" style="width:100%;max-width:760px;height:auto;background:#ffffff;border:1px solid #d0d7de;border-radius:6px">
<title id="architecture-static-tick-title">Static monitor tick without a source barrier</title>
<desc id="architecture-static-tick-desc">A static tick loads inputs into stable environment slots and enters one main range with no source barrier. It first attempts eligible whole-plan fused JIT execution; otherwise quickened steps, per-stream JIT, and canonical fallback evaluate the row. Temporal state commits exactly once when required, and saved output slots project the completed row.</desc>
<defs>
  <marker id="architecture-static-tick-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#65758b"/>
  </marker>
</defs>
<text x="24" y="29" text-anchor="start" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#17212b">Static tick: one range, one commit boundary</text>
<rect x="140" y="55" width="480" height="72" rx="5" fill="#e8f1fb" stroke="#2563a6" stroke-width="1.5"/>
<text x="380" y="88" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">1  load input row</text>
<text x="380" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">write declared inputs into stable EnvironmentSlots</text>
<line x1="380" y1="127" x2="380" y2="162" stroke="#65758b" stroke-width="1.8" marker-end="url(#architecture-static-tick-arrow)"/>
<rect x="140" y="162" width="480" height="72" rx="5" fill="#e6f5f0" stroke="#147d64" stroke-width="1.5"/>
<text x="380" y="193" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">single main range</text>
<text x="380" y="213" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#147d64">no source barrier</text>
<text x="380" y="228" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#52606d">fixed dependency-first order</text>
<line x1="380" y1="234" x2="380" y2="269" stroke="#65758b" stroke-width="1.8" marker-end="url(#architecture-static-tick-arrow)"/>
<rect x="140" y="269" width="480" height="82" rx="5" fill="#f3ebf8" stroke="#8055a3" stroke-width="1.5"/>
<text x="380" y="301" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">2  attempt whole-plan fused JIT</text>
<text x="380" y="322" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">fused scalar, then eligible fused temporal artifact</text>
<text x="380" y="340" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#52606d">unsupported shapes or side exits fall through safely</text>
<path d="M 380 351 L 380 385 L 215 385 L 215 411" fill="none" stroke="#65758b" stroke-width="1.8" marker-end="url(#architecture-static-tick-arrow)"/>
<path d="M 380 351 L 380 385 L 545 385 L 545 411" fill="none" stroke="#65758b" stroke-width="1.8" marker-end="url(#architecture-static-tick-arrow)"/>
<text x="260" y="378" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#52606d">handled</text>
<text x="500" y="378" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#52606d">fallback</text>
<rect x="60" y="411" width="310" height="100" rx="5" fill="#e6f5f0" stroke="#147d64" stroke-width="1.5"/>
<text x="215" y="443" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">fused row execution</text>
<text x="215" y="464" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">publish every stream output</text>
<text x="215" y="483" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">materialize canonical state on fallback</text>
<text x="215" y="501" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#52606d">temporal artifact may commit internally</text>
<rect x="390" y="411" width="310" height="100" rx="5" fill="#fff1e6" stroke="#b54708" stroke-width="1.5"/>
<text x="545" y="443" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">quick / canonical path</text>
<text x="545" y="464" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">QuickPlan steps preserve publication</text>
<text x="545" y="483" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">per-stream JIT may assist</text>
<text x="545" y="501" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#52606d">canonical evaluator is universal fallback</text>
<path d="M 215 511 L 215 550 L 330 577" fill="none" stroke="#65758b" stroke-width="1.8" marker-end="url(#architecture-static-tick-arrow)"/>
<path d="M 545 511 L 545 550 L 430 577" fill="none" stroke="#65758b" stroke-width="1.8" marker-end="url(#architecture-static-tick-arrow)"/>
<rect x="140" y="577" width="480" height="88" rx="5" fill="#e6f5f0" stroke="#147d64" stroke-width="1.5"/>
<text x="380" y="609" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">3  temporal commit when needed</text>
<text x="380" y="630" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">one logical commit: native or monitor-managed</text>
<text x="380" y="649" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#52606d">staged writes become visible only after the row</text>
<line x1="380" y1="665" x2="380" y2="706" stroke="#65758b" stroke-width="1.8" marker-end="url(#architecture-static-tick-arrow)"/>
<rect x="140" y="706" width="480" height="76" rx="5" fill="#e8f1fb" stroke="#2563a6" stroke-width="1.5"/>
<text x="380" y="739" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">4  project outputs</text>
<text x="380" y="759" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">copy saved output slots from the completed row</text>
<text x="380" y="819" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">Every logical stream publishes once; tier choice does not change semantics.</text>
</svg>
