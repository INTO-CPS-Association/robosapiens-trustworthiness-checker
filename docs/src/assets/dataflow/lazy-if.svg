<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 400" role="img" aria-labelledby="if-arrow-title if-arrow-desc" style="width:100%;max-width:930px;height:auto;background:#ffffff;border:1px solid #d0d7de;border-radius:6px">
<title id="if-arrow-title">Conditional evaluation in ordinary and recursive contexts</title>
<desc id="if-arrow-desc">Ordinary conditionals evaluate both branch EvaluationGraphs so both persistent StreamStates advance before one result is selected. In recursive call context a Boolean evaluates only its selected branch, while Deferred or NoVal evaluates neither branch. Reconfiguration points inside lazy branches are rejected during compilation.</desc>
<defs>
  <marker id="if-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#65758b"/>
  </marker>
</defs>
<text x="24" y="27" text-anchor="start" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#17212b">Lazy if: ordinary timelines and recursive base cases</text>
<rect x="35" y="78" width="190" height="64" rx="5" fill="#e8f1fb" stroke="#2563a6" stroke-width="1.5"/>
<text x="130" y="108" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">condition</text>
<text x="130" y="126" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">retained stream-lifted value</text>
<rect x="310" y="52" width="235" height="64" rx="5" fill="#e6f5f0" stroke="#147d64" stroke-width="1.5"/>
<text x="427" y="82" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">then EvaluationGraph</text>
<text x="427" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">own persistent StreamState</text>
<rect x="310" y="142" width="235" height="64" rx="5" fill="#fff1e6" stroke="#b54708" stroke-width="1.5"/>
<text x="427" y="172" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">else EvaluationGraph</text>
<text x="427" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">own persistent StreamState</text>
<line x1="225" y1="100" x2="310" y2="84" stroke="#65758b" stroke-width="1.8" marker-end="url(#if-arrow)"/>
<line x1="225" y1="120" x2="310" y2="174" stroke="#65758b" stroke-width="1.8" marker-end="url(#if-arrow)"/>
<rect x="630" y="92" width="260" height="74" rx="5" fill="#f3ebf8" stroke="#8055a3" stroke-width="1.5"/>
<text x="760" y="127" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">ordinary if</text>
<text x="760" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">advance both; select one result</text>
<line x1="545" y1="84" x2="630" y2="116" stroke="#65758b" stroke-width="1.8" marker-end="url(#if-arrow)"/>
<line x1="545" y1="174" x2="630" y2="142" stroke="#65758b" stroke-width="1.8" marker-end="url(#if-arrow)"/>
<line x1="25" y1="235" x2="905" y2="235" stroke="#a8b3bf" stroke-width="1"/>
<rect x="35" y="265" width="240" height="68" rx="5" fill="#e8f1fb" stroke="#2563a6" stroke-width="1.5"/>
<text x="155" y="297" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">recursive call context</text>
<text x="155" y="315" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">genuinely lazy selection</text>
<rect x="345" y="265" width="240" height="68" rx="5" fill="#e6f5f0" stroke="#147d64" stroke-width="1.5"/>
<text x="465" y="297" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">Bool condition</text>
<text x="465" y="315" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">evaluate selected branch only</text>
<rect x="655" y="265" width="240" height="68" rx="5" fill="#fff1e6" stroke="#b54708" stroke-width="1.5"/>
<text x="775" y="297" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#17212b">Deferred or NoVal</text>
<text x="775" y="315" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">evaluate neither branch</text>
<line x1="275" y1="299" x2="345" y2="299" stroke="#65758b" stroke-width="1.8" marker-end="url(#if-arrow)"/>
<path d="M 275 315 C 430 390, 560 390, 655 315" fill="none" stroke="#65758b" stroke-width="1.8" marker-end="url(#if-arrow)"/>
<text x="465" y="386" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52606d">Reconfiguration points inside either lazy branch are rejected during compilation</text>
</svg>
