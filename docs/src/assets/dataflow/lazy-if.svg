<svg class="tc-figure" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 400" role="img" aria-labelledby="if-arrow-title if-arrow-desc" style="width:100%;max-width:930px;height:auto;background:var(--fig-bg);border:1px solid var(--fig-edge);border-radius:6px">
<title id="if-arrow-title">Conditional evaluation in ordinary and recursive contexts</title>
<desc id="if-arrow-desc">Ordinary conditionals evaluate both branch EvaluationGraphs so both persistent EvaluatorStates advance before one result is selected. In recursive call context the condition first retains the last Boolean across NoVal. An effective Boolean evaluates only its selected branch; Deferred, or NoVal without a retained Boolean, evaluates neither branch. Reconfigurable expressions inside lazy branches are rejected during compilation.</desc>
  <!--
    Theme tokens. In the book these are overridden per theme by theme/diagram-theme.css; this block
    is the fallback that keeps the figure readable standalone, as an image, and when rustdoc inlines
    it with include_str!. Scoped to .tc-figure, never :root, so inlining cannot leak the names.
  -->
  <style>
    .tc-figure {
      --fig-bg: var(--fig-bg); --fig-edge: var(--fig-edge);
      --fig-ink: var(--fig-ink); --fig-ink-2: var(--fig-ink-2); --fig-line: var(--fig-line);
      --fig-panel: var(--fig-panel); --fig-panel-line: var(--fig-panel-line);
      --fig-blue: var(--fig-blue); --fig-blue-line: var(--fig-blue-line);
      --fig-green: var(--fig-green); --fig-green-line: var(--fig-green-line);
      --fig-orange: var(--fig-orange); --fig-orange-line: var(--fig-orange-line);
      --fig-purple: var(--fig-purple); --fig-purple-line: var(--fig-purple-line);
      --fig-source: var(--fig-source); --fig-source-line: var(--fig-source-line);
      --fig-redis: var(--fig-redis); --fig-redis-line: var(--fig-redis-line);
      --fig-checker: var(--fig-checker); --fig-checker-line: var(--fig-checker-line);
      --fig-knowledge: var(--fig-knowledge); --fig-knowledge-line: var(--fig-knowledge-line);
    }
    @media (prefers-color-scheme: dark) {
      .tc-figure {
        --fig-bg: #171b26; --fig-edge: #333a4d;
        --fig-ink: #e6e9f0; --fig-ink-2: #a2acbd; --fig-line: #8492a6;
        --fig-panel: #1e2432; --fig-panel-line: #3d465c;
        --fig-blue: #16283d; --fig-blue-line: #6aa9e0;
        --fig-green: #123029; --fig-green-line: #4fbfa0;
        --fig-orange: #33240f; --fig-orange-line: #e0a44e;
        --fig-purple: #241c33; --fig-purple-line: #b18fd4;
        --fig-source: #14283c; --fig-source-line: #6fa8db;
        --fig-redis: #33260f; --fig-redis-line: #d99a3f;
        --fig-checker: #241d34; --fig-checker-line: #a892d6;
        --fig-knowledge: #132c1c; --fig-knowledge-line: #5fae74;
      }
    }
  </style>
<defs>
  <marker id="if-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--fig-line)"/>
  </marker>
</defs>
<text x="24" y="27" text-anchor="start" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="var(--fig-ink)">Lazy if: ordinary timelines and recursive base cases</text>
<rect x="35" y="78" width="190" height="64" rx="5" fill="var(--fig-blue)" stroke="var(--fig-blue-line)" stroke-width="1.5"/>
<text x="130" y="108" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="var(--fig-ink)">condition</text>
<text x="130" y="126" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="var(--fig-ink-2)">retained stream-lifted value</text>
<rect x="310" y="52" width="235" height="64" rx="5" fill="var(--fig-green)" stroke="var(--fig-green-line)" stroke-width="1.5"/>
<text x="427" y="82" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="var(--fig-ink)">then EvaluationGraph</text>
<text x="427" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="var(--fig-ink-2)">own persistent EvaluatorState</text>
<rect x="310" y="142" width="235" height="64" rx="5" fill="var(--fig-orange)" stroke="var(--fig-orange-line)" stroke-width="1.5"/>
<text x="427" y="172" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="var(--fig-ink)">else EvaluationGraph</text>
<text x="427" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="var(--fig-ink-2)">own persistent EvaluatorState</text>
<line x1="225" y1="100" x2="310" y2="84" stroke="var(--fig-line)" stroke-width="1.8" marker-end="url(#if-arrow)"/>
<line x1="225" y1="120" x2="310" y2="174" stroke="var(--fig-line)" stroke-width="1.8" marker-end="url(#if-arrow)"/>
<rect x="630" y="92" width="260" height="74" rx="5" fill="var(--fig-purple)" stroke="var(--fig-purple-line)" stroke-width="1.5"/>
<text x="760" y="127" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="var(--fig-ink)">ordinary if</text>
<text x="760" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="var(--fig-ink-2)">advance both; select one result</text>
<line x1="545" y1="84" x2="630" y2="116" stroke="var(--fig-line)" stroke-width="1.8" marker-end="url(#if-arrow)"/>
<line x1="545" y1="174" x2="630" y2="142" stroke="var(--fig-line)" stroke-width="1.8" marker-end="url(#if-arrow)"/>
<line x1="25" y1="235" x2="905" y2="235" stroke="var(--fig-panel-line)" stroke-width="1"/>
<rect x="35" y="265" width="240" height="68" rx="5" fill="var(--fig-blue)" stroke="var(--fig-blue-line)" stroke-width="1.5"/>
<text x="155" y="297" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="var(--fig-ink)">recursive call context</text>
<text x="155" y="315" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="var(--fig-ink-2)">genuinely lazy selection</text>
<rect x="345" y="265" width="240" height="68" rx="5" fill="var(--fig-green)" stroke="var(--fig-green-line)" stroke-width="1.5"/>
<text x="465" y="297" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="var(--fig-ink)">effective Bool</text>
<text x="465" y="315" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="var(--fig-ink-2)">current or retained; select one branch</text>
<rect x="655" y="265" width="240" height="68" rx="5" fill="var(--fig-orange)" stroke="var(--fig-orange-line)" stroke-width="1.5"/>
<text x="775" y="297" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="var(--fig-ink)">Deferred or unretained NoVal</text>
<text x="775" y="315" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="var(--fig-ink-2)">evaluate neither branch</text>
<line x1="275" y1="299" x2="345" y2="299" stroke="var(--fig-line)" stroke-width="1.8" marker-end="url(#if-arrow)"/>
<path d="M 275 315 C 430 390, 560 390, 655 315" fill="none" stroke="var(--fig-line)" stroke-width="1.8" marker-end="url(#if-arrow)"/>
<text x="465" y="386" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="var(--fig-ink-2)">Reconfigurable expressions inside either lazy branch are rejected during compilation</text>
</svg>
