<svg class="tc-figure" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" role="img" aria-labelledby="example-arrow-title example-arrow-desc" style="width:100%;max-width:800px;height:auto;background:var(--fig-bg);border:1px solid var(--fig-edge);border-radius:6px">
<title id="example-arrow-title">Stream dependencies in the running example</title>
<desc id="example-arrow-desc">Input x flows through scaled, total, and alert during one tick. Total also reads retained previous-tick state through its delayed self-reference.</desc>
  <!--
    Theme tokens. In the book these are overridden per theme by theme/diagram-theme.css; this block
    is the fallback that keeps the figure readable standalone, as an image, and when rustdoc inlines
    it with include_str!. Scoped to .tc-figure, never :root, so inlining cannot leak the names.
  -->
  <style>
    .tc-figure {
      --fig-bg: #ffffff;
      --fig-edge: #d0d7de;
      --fig-ink: #17212b;
      --fig-ink-2: #52606d;
      --fig-line: #65758b;
      --fig-panel: #f7f9fb;
      --fig-panel-line: #a8b3bf;
      --fig-blue: #e8f1fb;
      --fig-blue-line: #2563a6;
      --fig-green: #e6f5f0;
      --fig-green-line: #147d64;
      --fig-orange: #fff1e6;
      --fig-orange-line: #b54708;
      --fig-purple: #f3ebf8;
      --fig-purple-line: #8055a3;
      --fig-source: #eef6ff;
      --fig-source-line: #3478b8;
      --fig-redis: #fff5e8;
      --fig-redis-line: #bc6b16;
      --fig-checker: #f1ecff;
      --fig-checker-line: #7254b3;
      --fig-knowledge: #eaf8ee;
      --fig-knowledge-line: #39834d;
    }
    @media (prefers-color-scheme: dark) {
      .tc-figure {
        --fig-bg: #171b26;
        --fig-edge: #333a4d;
        --fig-ink: #e6e9f0;
        --fig-ink-2: #a2acbd;
        --fig-line: #8492a6;
        --fig-panel: #1e2432;
        --fig-panel-line: #3d465c;
        --fig-blue: #16283d;
        --fig-blue-line: #6aa9e0;
        --fig-green: #123029;
        --fig-green-line: #4fbfa0;
        --fig-orange: #33240f;
        --fig-orange-line: #e0a44e;
        --fig-purple: #241c33;
        --fig-purple-line: #b18fd4;
        --fig-source: #14283c;
        --fig-source-line: #6fa8db;
        --fig-redis: #33260f;
        --fig-redis-line: #d99a3f;
        --fig-checker: #241d34;
        --fig-checker-line: #a892d6;
        --fig-knowledge: #132c1c;
        --fig-knowledge-line: #5fae74;
      }
    }
  </style>
<defs>
  <marker id="example-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--fig-line)"/>
  </marker>
</defs>
<text x="24" y="27" text-anchor="start" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="var(--fig-ink)">Running example: stream dependencies</text>
<rect x="55" y="62" width="120" height="44" rx="5" fill="var(--fig-blue)" stroke="var(--fig-blue-line)" stroke-width="1.5"/>
<text x="115" y="89" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="var(--fig-ink)">x</text>
<rect x="245" y="62" width="120" height="44" rx="5" fill="var(--fig-green)" stroke="var(--fig-green-line)" stroke-width="1.5"/>
<text x="305" y="89" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="var(--fig-ink)">scaled</text>
<rect x="435" y="62" width="120" height="44" rx="5" fill="var(--fig-orange)" stroke="var(--fig-orange-line)" stroke-width="1.5"/>
<text x="495" y="89" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="var(--fig-ink)">total</text>
<rect x="625" y="62" width="120" height="44" rx="5" fill="var(--fig-purple)" stroke="var(--fig-purple-line)" stroke-width="1.5"/>
<text x="685" y="89" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="var(--fig-ink)">alert</text>
<line x1="175" y1="84" x2="245" y2="84" stroke="var(--fig-line)" stroke-width="1.8" marker-end="url(#example-arrow)"/>
<line x1="365" y1="84" x2="435" y2="84" stroke="var(--fig-line)" stroke-width="1.8" marker-end="url(#example-arrow)"/>
<line x1="555" y1="84" x2="625" y2="84" stroke="var(--fig-line)" stroke-width="1.8" marker-end="url(#example-arrow)"/>
<path d="M 495 106 C 495 158, 555 158, 555 106" fill="none" stroke="var(--fig-orange-line)" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#example-arrow)"/>
<text x="525" y="162" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="var(--fig-ink-2)">previous tick: total[1]</text>
</svg>
