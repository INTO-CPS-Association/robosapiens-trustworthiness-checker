<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="dynamic-dependencies-arrow-title dynamic-dependencies-arrow-desc" style="width:100%;max-width:1000px;height:auto;background:#ffffff;border:1px solid #d0d7de;border-radius:6px">
<title id="dynamic-dependencies-arrow-title">Potential dependency graph, scope matrix, and runtime schedule repair</title>
<desc id="dynamic-dependencies-arrow-desc">The full dashed potential graph and compile-time matrix both show that dynamic stream a may read x or b and dynamic stream b may read x or a; self reads are excluded. Dependency arrows point from a stream to what it reads. At runtime tick n, source values activate a to b to x and repair cached order a then b to b then a. At the next runtime tick, new source values activate b to a to x and repair the cached order back to a then b. The ticks are consecutive logical input rows, not stages of one evaluation.</desc>
<defs>
  <marker id="dynamic-dependencies-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#65758b"/>
  </marker>
</defs>
