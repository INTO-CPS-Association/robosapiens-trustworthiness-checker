<svg class="tc-figure" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="dynamic-dependencies-arrow-title dynamic-dependencies-arrow-desc" style="width:100%;max-width:1000px;height:auto;background:var(--fig-bg);border:1px solid var(--fig-edge);border-radius:6px">
<title id="dynamic-dependencies-arrow-title">Potential dependency graph, scope matrix, and runtime schedule repair</title>
<desc id="dynamic-dependencies-arrow-desc">The dashed automatic-scope graph and compile-time matrix show that dynamic stream a may read preloaded input x or stream b and dynamic stream b may read preloaded input x or stream a. Automatic top-level scope excludes the containing stream itself; restricted or explicit scopes retain their declared permitted names after environment restriction. Dependency arrows point from each producer to its same-tick consumer. At runtime tick n, source values activate x to b to a and repair cached order a then b to b then a. At the next runtime tick, new source values activate x to a to b and repair the cached order back to a then b. The ticks are consecutive logical input rows, not stages of one evaluation.</desc>
  <!--
    Theme tokens. In the book these are overridden per theme by theme/diagram-theme.css; this block
    is the fallback that keeps the figure readable standalone, as an image, and when rustdoc inlines
    it with include_str!. Scoped to .tc-figure, never :root, so inlining cannot leak the names.
  -->
  <style>
    .tc-figure {
      --fig-bg: #ffffff;
      --fig-edge: #d0d7de;
      --fig-ink: #17212b;
      --fig-ink-2: #52606d;
      --fig-line: #65758b;
      --fig-panel: #f7f9fb;
      --fig-panel-line: #a8b3bf;
      --fig-blue: #e8f1fb;
      --fig-blue-line: #2563a6;
      --fig-green: #e6f5f0;
      --fig-green-line: #147d64;
      --fig-orange: #fff1e6;
      --fig-orange-line: #b54708;
      --fig-purple: #f3ebf8;
      --fig-purple-line: #8055a3;
      --fig-source: #eef6ff;
      --fig-source-line: #3478b8;
      --fig-redis: #fff5e8;
      --fig-redis-line: #bc6b16;
      --fig-checker: #f1ecff;
      --fig-checker-line: #7254b3;
      --fig-knowledge: #eaf8ee;
      --fig-knowledge-line: #39834d;
    }
    @media (prefers-color-scheme: dark) {
      .tc-figure {
        --fig-bg: #171b26;
        --fig-edge: #333a4d;
        --fig-ink: #e6e9f0;
        --fig-ink-2: #a2acbd;
        --fig-line: #8492a6;
        --fig-panel: #1e2432;
        --fig-panel-line: #3d465c;
        --fig-blue: #16283d;
        --fig-blue-line: #6aa9e0;
        --fig-green: #123029;
        --fig-green-line: #4fbfa0;
        --fig-orange: #33240f;
        --fig-orange-line: #e0a44e;
        --fig-purple: #241c33;
        --fig-purple-line: #b18fd4;
        --fig-source: #14283c;
        --fig-source-line: #6fa8db;
        --fig-redis: #33260f;
        --fig-redis-line: #d99a3f;
        --fig-checker: #241d34;
        --fig-checker-line: #a892d6;
        --fig-knowledge: #132c1c;
        --fig-knowledge-line: #5fae74;
      }
    }
  </style>
