<svg class="tc-figure" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 455" role="img" aria-labelledby="two-tick-title two-tick-desc" style="width:100%; max-width:960px; height:auto; background:var(--fig-bg);">
  <title id="two-tick-title">Two ticks and the temporal commit between them</title>
  <desc id="two-tick-desc">Read each logical tick from top to bottom in the exact rows x, scaled, total[1], total, and alert. At t1 the values are 4, 8, Deferred with default to 0, 8, and false. At t2 they are 8, 16, 8 historical, 24, and true. The compact commit cell between t1 and t2 records total equals 8 after the t1 row succeeds. Its single dashed horizontal arrow points to the t2 position to show when that value becomes history; it is not a current dependency. The shared baseline and short ticks mark logical positions. After t2 completes, total equals 24 is committed for the following tick.</desc>
  <!--
    Theme tokens. In the book these are overridden per theme by theme/diagram-theme.css; this block
    is the fallback that keeps the figure readable standalone, as an image, and when rustdoc inlines
    it with include_str!. Scoped to .tc-figure, never :root, so inlining cannot leak the names.
  -->
  <style>
    .tc-figure {
      --fig-bg: var(--fig-bg); --fig-edge: var(--fig-edge);
      --fig-ink: var(--fig-ink); --fig-ink-2: var(--fig-ink-2); --fig-line: var(--fig-line);
      --fig-panel: var(--fig-panel); --fig-panel-line: var(--fig-panel-line);
      --fig-blue: var(--fig-blue); --fig-blue-line: var(--fig-blue-line);
      --fig-green: var(--fig-green); --fig-green-line: var(--fig-green-line);
      --fig-orange: var(--fig-orange); --fig-orange-line: var(--fig-orange-line);
      --fig-purple: var(--fig-purple); --fig-purple-line: var(--fig-purple-line);
      --fig-source: var(--fig-source); --fig-source-line: var(--fig-source-line);
      --fig-redis: var(--fig-redis); --fig-redis-line: var(--fig-redis-line);
      --fig-checker: var(--fig-checker); --fig-checker-line: var(--fig-checker-line);
      --fig-knowledge: var(--fig-knowledge); --fig-knowledge-line: var(--fig-knowledge-line);
    }
    @media (prefers-color-scheme: dark) {
      .tc-figure {
        --fig-bg: #171b26; --fig-edge: #333a4d;
        --fig-ink: #e6e9f0; --fig-ink-2: #a2acbd; --fig-line: #8492a6;
        --fig-panel: #1e2432; --fig-panel-line: #3d465c;
        --fig-blue: #16283d; --fig-blue-line: #6aa9e0;
        --fig-green: #123029; --fig-green-line: #4fbfa0;
        --fig-orange: #33240f; --fig-orange-line: #e0a44e;
        --fig-purple: #241c33; --fig-purple-line: #b18fd4;
        --fig-source: #14283c; --fig-source-line: #6fa8db;
        --fig-redis: #33260f; --fig-redis-line: #d99a3f;
        --fig-checker: #241d34; --fig-checker-line: #a892d6;
        --fig-knowledge: #132c1c; --fig-knowledge-line: #5fae74;
      }
    }
  </style>
  <defs>
    <marker id="two-tick-evaluation-arrow"
            markerWidth="7"
            markerHeight="7"
            refX="9"
            refY="5"
            viewBox="0 0 10 10"
            orient="auto"
            markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--fig-line)" />
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="455" fill="var(--fig-bg)" />
  <rect x="0.75" y="0.75" width="958.5" height="453.5" rx="6"
        fill="var(--fig-bg)" stroke="var(--fig-edge)" stroke-width="1.5" />
  <text x="28" y="32"
        fill="var(--fig-ink)"
        font-family="system-ui, sans-serif"
        font-size="15"
        font-weight="700">Two ticks and the temporal commit between them</text>
  <g fill="var(--fig-ink)"
     font-family="system-ui, sans-serif"
     font-size="13"
     font-weight="600"
     text-anchor="middle">
    <text x="310" y="58">t1</text>
    <text x="520" y="58">post-row commit</text>
    <text x="730" y="58">t2</text>
  </g>
  <line x1="210" y1="365" x2="850" y2="365"
        fill="none"
        stroke="var(--fig-line)"
        stroke-width="1.5"
        marker-end="url(#two-tick-evaluation-arrow)" />
  <text x="862" y="370"
        fill="var(--fig-ink-2)"
        font-family="system-ui, sans-serif"
        font-size="11">logical time</text>
  <g stroke="var(--fig-line)" stroke-width="1.5">
    <line x1="310" y1="359" x2="310" y2="371" />
    <line x1="730" y1="359" x2="730" y2="371" />
  </g>
  <g fill="var(--fig-ink)"
     font-family="ui-monospace, monospace"
     font-size="13"
     font-weight="600">
    <text x="28" y="103">x</text>
    <text x="28" y="153">scaled</text>
    <text x="28" y="207">total[1]</text>
    <text x="28" y="263">total</text>
    <text x="28" y="313">alert</text>
  </g>
  <g font-family="ui-monospace, monospace"
     font-size="13"
     font-weight="600"
     fill="var(--fig-ink)"
     text-anchor="middle">
    <rect x="254" y="77" width="112" height="42" rx="5"
          fill="var(--fig-blue)" stroke="var(--fig-blue-line)" stroke-width="1.5" />
    <text x="310" y="103">4</text>
    <rect x="674" y="77" width="112" height="42" rx="5"
          fill="var(--fig-blue)" stroke="var(--fig-blue-line)" stroke-width="1.5" />
    <text x="730" y="103">8</text>
    <rect x="254" y="127" width="112" height="42" rx="5"
          fill="var(--fig-green)" stroke="var(--fig-green-line)" stroke-width="1.5" />
    <text x="310" y="153">8</text>
    <rect x="674" y="127" width="112" height="42" rx="5"
          fill="var(--fig-green)" stroke="var(--fig-green-line)" stroke-width="1.5" />
    <text x="730" y="153">16</text>
    <rect x="254" y="177" width="112" height="50" rx="5"
          fill="var(--fig-purple)" stroke="var(--fig-purple-line)" stroke-width="1.5" />
    <text x="310" y="198">Deferred</text>
    <text x="310" y="216"
          font-family="system-ui, sans-serif"
          font-size="11"
          font-weight="400"
          fill="var(--fig-ink-2)">default → 0</text>
    <rect x="674" y="177" width="112" height="50" rx="5"
          fill="var(--fig-purple)" stroke="var(--fig-purple-line)" stroke-width="1.5" />
    <text x="730" y="198">8</text>
    <text x="730" y="216"
          font-family="system-ui, sans-serif"
          font-size="11"
          font-weight="400"
          fill="var(--fig-ink-2)">historical</text>
    <rect x="254" y="237" width="112" height="42" rx="5"
          fill="var(--fig-green)" stroke="var(--fig-green-line)" stroke-width="1.5" />
    <text x="310" y="263">8</text>
    <rect x="674" y="237" width="112" height="42" rx="5"
          fill="var(--fig-green)" stroke="var(--fig-green-line)" stroke-width="1.5" />
    <text x="730" y="263">24</text>
    <rect x="254" y="287" width="112" height="42" rx="5"
          fill="var(--fig-green)" stroke="var(--fig-green-line)" stroke-width="1.5" />
    <text x="310" y="313">false</text>
    <rect x="674" y="287" width="112" height="42" rx="5"
          fill="var(--fig-green)" stroke="var(--fig-green-line)" stroke-width="1.5" />
    <text x="730" y="313">true</text>
  </g>
  <rect x="454" y="382" width="132" height="42" rx="5"
        fill="var(--fig-purple)" stroke="var(--fig-purple-line)" stroke-width="1.5" />
  <text x="520" y="402"
        fill="var(--fig-ink)"
        font-family="ui-monospace, monospace"
        font-size="12"
        font-weight="600"
        text-anchor="middle">commit: total = 8</text>
  <text x="520" y="417"
        fill="var(--fig-ink-2)"
        font-family="system-ui, sans-serif"
        font-size="10.5"
        text-anchor="middle">after t1 row</text>
  <path d="M 586 403 H 730"
        fill="none"
        stroke="var(--fig-purple-line)"
        stroke-width="1.5"
        stroke-dasharray="5 4"
        marker-end="url(#two-tick-evaluation-arrow)" />
  <text x="658" y="442"
        fill="var(--fig-ink-2)"
        font-family="system-ui, sans-serif"
        font-size="10.5"
        text-anchor="middle">historical at t2</text>
</svg>
