<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 960 455"
     role="img"
     aria-labelledby="two-tick-title two-tick-desc"
     style="width:100%; max-width:960px; height:auto; background:#ffffff;">
  <title id="two-tick-title">Two ticks and the temporal commit between them</title>
  <desc id="two-tick-desc">Read each logical tick from top to bottom in the exact rows x, scaled, total[1], total, and alert. At t1 the values are 4, 8, Deferred with default to 0, 8, and false. At t2 they are 8, 16, 8 historical, 24, and true. The compact commit cell between t1 and t2 records total equals 8 after the t1 row succeeds. Its single dashed horizontal arrow points to the t2 position to show when that value becomes history; it is not a current dependency. The shared baseline and short ticks mark logical positions. After t2 completes, total equals 24 is committed for the following tick.</desc>

  <defs>
    <marker id="two-tick-evaluation-arrow"
            markerWidth="7"
            markerHeight="7"
            refX="9"
            refY="5"
            viewBox="0 0 10 10"
            orient="auto"
            markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#65758b" />
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="455" fill="#ffffff" />
  <rect x="0.75" y="0.75" width="958.5" height="453.5" rx="6"
        fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" />

  <text x="28" y="32"
        fill="#17212b"
        font-family="system-ui, sans-serif"
        font-size="15"
        font-weight="700">Two ticks and the temporal commit between them</text>

  <g fill="#17212b"
     font-family="system-ui, sans-serif"
     font-size="13"
     font-weight="600"
     text-anchor="middle">
    <text x="310" y="58">t1</text>
    <text x="520" y="58">post-row commit</text>
    <text x="730" y="58">t2</text>
  </g>

  <line x1="210" y1="365" x2="850" y2="365"
        fill="none"
        stroke="#65758b"
        stroke-width="1.5"
        marker-end="url(#two-tick-evaluation-arrow)" />
  <text x="862" y="370"
        fill="#52606d"
        font-family="system-ui, sans-serif"
        font-size="11">logical time</text>

  <g stroke="#65758b" stroke-width="1.5">
    <line x1="310" y1="359" x2="310" y2="371" />
    <line x1="730" y1="359" x2="730" y2="371" />
  </g>

  <g fill="#17212b"
     font-family="ui-monospace, monospace"
     font-size="13"
     font-weight="600">
    <text x="28" y="103">x</text>
    <text x="28" y="153">scaled</text>
    <text x="28" y="207">total[1]</text>
    <text x="28" y="263">total</text>
    <text x="28" y="313">alert</text>
  </g>

  <g font-family="ui-monospace, monospace"
     font-size="13"
     font-weight="600"
     fill="#17212b"
     text-anchor="middle">
    <rect x="254" y="77" width="112" height="42" rx="5"
          fill="#e8f1fb" stroke="#2563a6" stroke-width="1.5" />
    <text x="310" y="103">4</text>
    <rect x="674" y="77" width="112" height="42" rx="5"
          fill="#e8f1fb" stroke="#2563a6" stroke-width="1.5" />
    <text x="730" y="103">8</text>

    <rect x="254" y="127" width="112" height="42" rx="5"
          fill="#e6f5f0" stroke="#147d64" stroke-width="1.5" />
    <text x="310" y="153">8</text>
    <rect x="674" y="127" width="112" height="42" rx="5"
          fill="#e6f5f0" stroke="#147d64" stroke-width="1.5" />
    <text x="730" y="153">16</text>

    <rect x="254" y="177" width="112" height="50" rx="5"
          fill="#f3ebf8" stroke="#8055a3" stroke-width="1.5" />
    <text x="310" y="198">Deferred</text>
    <text x="310" y="216"
          font-family="system-ui, sans-serif"
          font-size="11"
          font-weight="400"
          fill="#52606d">default → 0</text>
    <rect x="674" y="177" width="112" height="50" rx="5"
          fill="#f3ebf8" stroke="#8055a3" stroke-width="1.5" />
    <text x="730" y="198">8</text>
    <text x="730" y="216"
          font-family="system-ui, sans-serif"
          font-size="11"
          font-weight="400"
          fill="#52606d">historical</text>

    <rect x="254" y="237" width="112" height="42" rx="5"
          fill="#e6f5f0" stroke="#147d64" stroke-width="1.5" />
    <text x="310" y="263">8</text>
    <rect x="674" y="237" width="112" height="42" rx="5"
          fill="#e6f5f0" stroke="#147d64" stroke-width="1.5" />
    <text x="730" y="263">24</text>

    <rect x="254" y="287" width="112" height="42" rx="5"
          fill="#e6f5f0" stroke="#147d64" stroke-width="1.5" />
    <text x="310" y="313">false</text>
    <rect x="674" y="287" width="112" height="42" rx="5"
          fill="#e6f5f0" stroke="#147d64" stroke-width="1.5" />
    <text x="730" y="313">true</text>
  </g>

  <rect x="454" y="382" width="132" height="42" rx="5"
        fill="#f3ebf8" stroke="#8055a3" stroke-width="1.5" />
  <text x="520" y="402"
        fill="#17212b"
        font-family="ui-monospace, monospace"
        font-size="12"
        font-weight="600"
        text-anchor="middle">commit: total = 8</text>
  <text x="520" y="417"
        fill="#52606d"
        font-family="system-ui, sans-serif"
        font-size="10.5"
        text-anchor="middle">after t1 row</text>

  <path d="M 586 403 H 730"
        fill="none"
        stroke="#8055a3"
        stroke-width="1.5"
        stroke-dasharray="5 4"
        marker-end="url(#two-tick-evaluation-arrow)" />
  <text x="658" y="442"
        fill="#52606d"
        font-family="system-ui, sans-serif"
        font-size="10.5"
        text-anchor="middle">historical at t2</text>
</svg>
