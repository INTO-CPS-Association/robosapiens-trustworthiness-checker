    <rect x="264" y="188" width="92" height="52" rx="5"
          fill="var(--fig-blue)" stroke="var(--fig-blue-line)" stroke-width="1.5" />
    <text x="310" y="210"
          fill="var(--fig-ink)"
          font-family="ui-monospace, monospace"
          font-size="13"
          font-weight="600">d1</text>
    <text x="310" y="228"
          fill="var(--fig-ink-2)"
          font-family="system-ui, sans-serif"
          font-size="10.5">ordinary · OLD</text>
    <rect x="474" y="188" width="92" height="52" rx="5"
