<svg class="tc-figure" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 350" role="img" aria-labelledby="root-cutover-ticks-title root-cutover-ticks-desc" style="width:100%;max-width:1040px;height:auto;background:var(--fig-bg);">
  <title id="root-cutover-ticks-title">Root cutover: old drain precedes candidate processing</title>
  <desc id="root-cutover-ticks-desc">Read left to right on the single shared time baseline. Ordinary old data ticks d0 and d1 precede the delivered control request and barrier. The admitted old ticks d2 and d3 follow the barrier but are drained and evaluated under the old definition. Local input, output, monitor, revision, and row-layout changes then apply in sequence. The candidate state is active locally before acknowledgement is attempted, but the owner loop does not process candidate tick d4 unless acknowledgement succeeds. The barrier and processing-resumption positions are distinct. Dashed vertical guides mark those positions, while the solid horizontal arrow marks time. The sequence is ordered and non-transactional: earlier effects are not rolled back. The compact cells show temporal data and control facts only; phase internals are intentionally omitted.</desc>
