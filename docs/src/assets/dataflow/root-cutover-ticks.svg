  <rect x="645" y="94" width="130" height="48" rx="5"
        fill="var(--fig-green)" stroke="var(--fig-green-line)" stroke-width="1.5" />
  <text x="710" y="114" text-anchor="middle"
        fill="var(--fig-ink)"
        font-family="system-ui, sans-serif"
