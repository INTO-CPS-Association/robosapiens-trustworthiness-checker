<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 840 300"
     width="100%"
     role="img"
     aria-labelledby="finite-monitor-ticks-title finite-monitor-ticks-desc"
     style="width:100%; max-width:840px; height:auto; background:#ffffff;">
  <title id="finite-monitor-ticks-title">Finite simple_add ticks produce aligned z outputs</title>
  <desc id="finite-monitor-ticks-desc">Read left to right along one shared logical-tick baseline. The finite examples/simple_add.input trace contains tick 0 with simultaneous x equals 1 and y equals 2, followed by tick 1 with simultaneous x equals 3 and y equals 4. The simple_add monitor computes z equals x plus y at the same two logical positions, producing z equals 3 and z equals 7. Each input cell groups simultaneous updates; the two positions are separate ticks. End of input follows tick 1 and does not synthesize a third tick.</desc>

  <defs>
    <marker id="finite-monitor-ticks-arrow"
            markerWidth="7"
            markerHeight="7"
            refX="9"
            refY="5"
            viewBox="0 0 10 10"
            orient="auto"
            markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#65758b" />
    </marker>
  </defs>

  <rect x="0.75" y="0.75" width="838.5" height="298.5" rx="6"
        fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" />

  <text x="24" y="30"
        fill="#17212b"
        font-family="system-ui, sans-serif"
        font-size="15"
        font-weight="700">Finite simple_add ticks produce aligned z outputs</text>
  <text x="24" y="52"
        fill="#52606d"
        font-family="ui-monospace, monospace"
        font-size="11.5">examples/simple_add.input · z = x + y</text>

  <line x1="170" y1="91" x2="730" y2="91"
        fill="none"
        stroke="#65758b"
        stroke-width="1.5"
        marker-end="url(#finite-monitor-ticks-arrow)" />
  <text x="742" y="95"
        fill="#52606d"
        font-family="system-ui, sans-serif"
        font-size="11">logical order</text>

  <g stroke="#65758b" stroke-width="1.5">
    <line x1="300" y1="85" x2="300" y2="97" />
    <line x1="540" y1="85" x2="540" y2="97" />
  </g>
  <g text-anchor="middle"
     fill="#52606d"
     font-family="system-ui, sans-serif"
     font-size="11">
    <text x="300" y="77">tick 0</text>
    <text x="540" y="77">tick 1</text>
  </g>

  <g fill="#17212b">
    <text x="24" y="143"
          font-family="system-ui, sans-serif"
          font-size="13"
          font-weight="600">logical input</text>
    <text x="24" y="160"
          font-family="system-ui, sans-serif"
          font-size="11"
          fill="#52606d">simultaneous updates</text>
    <text x="24" y="226"
          font-family="ui-monospace, monospace"
          font-size="13"
          font-weight="600">z output</text>
    <text x="24" y="243"
          font-family="system-ui, sans-serif"
          font-size="11"
          fill="#52606d">one monitor row per tick</text>
  </g>

  <g text-anchor="middle"
     font-family="ui-monospace, monospace"
     font-size="11.5"
     font-weight="600"
     fill="#17212b">
    <rect x="220" y="117" width="160" height="46" rx="5"
          fill="#e8f1fb" stroke="#2563a6" stroke-width="1.5" />
    <text x="300" y="145">{ x = 1, y = 2 }</text>
    <rect x="460" y="117" width="160" height="46" rx="5"
          fill="#e8f1fb" stroke="#2563a6" stroke-width="1.5" />
    <text x="540" y="145">{ x = 3, y = 4 }</text>

    <rect x="250" y="200" width="100" height="46" rx="5"
          fill="#e6f5f0" stroke="#147d64" stroke-width="1.5" />
    <text x="300" y="228">z = 3</text>
    <rect x="490" y="200" width="100" height="46" rx="5"
          fill="#e6f5f0" stroke="#147d64" stroke-width="1.5" />
    <text x="540" y="228">z = 7</text>
  </g>

  <text x="420" y="279"
        text-anchor="middle"
        fill="#52606d"
        font-family="system-ui, sans-serif"
        font-size="11">EOF after tick 1 · no synthesized tick 2</text>
</svg>
