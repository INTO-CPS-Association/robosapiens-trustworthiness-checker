<svg class="tc-figure" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="100%" role="img" aria-labelledby="finite-monitor-ticks-title finite-monitor-ticks-desc" style="width:100%; max-width:840px; height:auto; background:var(--fig-bg);">
  <title id="finite-monitor-ticks-title">Finite simple_add ticks produce aligned z outputs</title>
  <desc id="finite-monitor-ticks-desc">Read left to right along one shared logical-tick baseline. The finite examples/simple_add.input trace contains tick 0 with simultaneous x equals 1 and y equals 2, followed by tick 1 with simultaneous x equals 3 and y equals 4. The simple_add monitor computes z equals x plus y at the same two logical positions, producing z equals 3 and z equals 7. Each input cell groups simultaneous updates; the two positions are separate ticks. End of input follows tick 1 and does not synthesize a third tick.</desc>
  <style>
    .tc-figure {
      --fig-bg: #ffffff;
      --fig-edge: #d0d7de;
      --fig-ink: #17212b;
      --fig-ink-2: #52606d;
      --fig-line: #65758b;
      --fig-panel: #f7f9fb;
      --fig-panel-line: #a8b3bf;
      --fig-blue: #e8f1fb;
      --fig-blue-line: #2563a6;
      --fig-green: #e6f5f0;
      --fig-green-line: #147d64;
      --fig-orange: #fff1e6;
      --fig-orange-line: #b54708;
      --fig-purple: #f3ebf8;
      --fig-purple-line: #8055a3;
      --fig-source: #eef6ff;
      --fig-source-line: #3478b8;
      --fig-redis: #fff5e8;
      --fig-redis-line: #bc6b16;
      --fig-checker: #f1ecff;
      --fig-checker-line: #7254b3;
      --fig-knowledge: #eaf8ee;
      --fig-knowledge-line: #39834d;
    }
    @media (prefers-color-scheme: dark) {
      .tc-figure {
        --fig-bg: #171b26;
        --fig-edge: #333a4d;
        --fig-ink: #e6e9f0;
        --fig-ink-2: #a2acbd;
        --fig-line: #8492a6;
        --fig-panel: #1e2432;
        --fig-panel-line: #3d465c;
        --fig-blue: #16283d;
        --fig-blue-line: #6aa9e0;
        --fig-green: #123029;
        --fig-green-line: #4fbfa0;
        --fig-orange: #33240f;
        --fig-orange-line: #e0a44e;
        --fig-purple: #241c33;
        --fig-purple-line: #b18fd4;
        --fig-source: #14283c;
        --fig-source-line: #6fa8db;
        --fig-redis: #33260f;
        --fig-redis-line: #d99a3f;
        --fig-checker: #241d34;
        --fig-checker-line: #a892d6;
        --fig-knowledge: #132c1c;
        --fig-knowledge-line: #5fae74;
      }
    }
  </style>
  <defs>
    <marker id="finite-monitor-ticks-arrow"
            markerWidth="7"
            markerHeight="7"
            refX="9"
            refY="5"
            viewBox="0 0 10 10"
            orient="auto"
            markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--fig-line)" />
    </marker>
  </defs>
  <rect x="0.75" y="0.75" width="838.5" height="298.5" rx="6"
        fill="var(--fig-bg)" stroke="var(--fig-edge)" stroke-width="1.5" />
  <text x="24" y="30"
        fill="var(--fig-ink)"
        font-family="system-ui, sans-serif"
        font-size="15"
        font-weight="700">Finite simple_add ticks produce aligned z outputs</text>
  <text x="24" y="52"
        fill="var(--fig-ink-2)"
        font-family="ui-monospace, monospace"
        font-size="11.5">examples/simple_add.input · z = x + y</text>
  <line x1="170" y1="91" x2="730" y2="91"
        fill="none"
        stroke="var(--fig-line)"
        stroke-width="1.5"
        marker-end="url(#finite-monitor-ticks-arrow)" />
  <text x="742" y="95"
        fill="var(--fig-ink-2)"
        font-family="system-ui, sans-serif"
        font-size="11">logical order</text>
  <g stroke="var(--fig-line)" stroke-width="1.5">
    <line x1="300" y1="85" x2="300" y2="97" />
    <line x1="540" y1="85" x2="540" y2="97" />
  </g>
  <g text-anchor="middle"
     fill="var(--fig-ink-2)"
     font-family="system-ui, sans-serif"
     font-size="11">
    <text x="300" y="77">tick 0</text>
    <text x="540" y="77">tick 1</text>
  </g>
  <g fill="var(--fig-ink)">
    <text x="24" y="143"
          font-family="system-ui, sans-serif"
          font-size="13"
          font-weight="600">logical input</text>
    <text x="24" y="160"
          font-family="system-ui, sans-serif"
          font-size="11"
          fill="var(--fig-ink-2)">simultaneous updates</text>
    <text x="24" y="226"
          font-family="ui-monospace, monospace"
          font-size="13"
          font-weight="600">z output</text>
    <text x="24" y="243"
          font-family="system-ui, sans-serif"
          font-size="11"
          fill="var(--fig-ink-2)">one monitor row per tick</text>
  </g>
  <g text-anchor="middle"
     font-family="ui-monospace, monospace"
     font-size="11.5"
     font-weight="600"
     fill="var(--fig-ink)">
    <rect x="220" y="117" width="160" height="46" rx="5"
          fill="var(--fig-blue)" stroke="var(--fig-blue-line)" stroke-width="1.5" />
    <text x="300" y="145">{ x = 1, y = 2 }</text>
    <rect x="460" y="117" width="160" height="46" rx="5"
          fill="var(--fig-blue)" stroke="var(--fig-blue-line)" stroke-width="1.5" />
    <text x="540" y="145">{ x = 3, y = 4 }</text>
    <rect x="250" y="200" width="100" height="46" rx="5"
          fill="var(--fig-green)" stroke="var(--fig-green-line)" stroke-width="1.5" />
    <text x="300" y="228">z = 3</text>
    <rect x="490" y="200" width="100" height="46" rx="5"
          fill="var(--fig-green)" stroke="var(--fig-green-line)" stroke-width="1.5" />
    <text x="540" y="228">z = 7</text>
  </g>
  <text x="420" y="279"
        text-anchor="middle"
        fill="var(--fig-ink-2)"
        font-family="system-ui, sans-serif"
        font-size="11">EOF after tick 1 · no synthesized tick 2</text>
</svg>
