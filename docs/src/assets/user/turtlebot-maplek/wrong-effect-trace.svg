<svg class="tc-figure" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 335" width="100%" role="img" aria-labelledby="turtlebot-wrong-effect-trace-title turtlebot-wrong-effect-trace-desc" style="width:100%; max-width:740px; height:auto;">
  <title id="turtlebot-wrong-effect-trace-title">Delivery succeeds, but Execute reports the wrong spin</title>
  <desc id="turtlebot-wrong-effect-trace-desc">Selected native wrong-effect ticks 24 through 31. Legitimate accepts the 0.4 radian per second plan at 24, Execute starts at 25 and its service request at 27, and Delivered arrives at 28. Execute writes a configuration with 0.2 radian per second at 30, and Applied cites that effect at 31. The command comparison fails at tick 31 despite successful delivery. Both commands last eight seconds.</desc>
