  <title id="turtlebot-freshness-trace-title">Equal mask values can hide a stale Read</title>
  <desc id="turtlebot-freshness-trace-desc">Selected native record ticks 14 through 19 of same-value-update. Plan retains mask version v3, the version it read at tick 14, across all ticks. Newest observed mask is v3 until another writer stores v4 at tick 15, and v4 from then on. At Generated on tick 19, payload equality passes while exact version equality fails. Blank verdict positions have no Generated decision.</desc>
