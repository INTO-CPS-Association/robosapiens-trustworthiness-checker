      --fig-ink: #17212b;
      --fig-ink-2: #52606d;
      --fig-line: #65758b;
      --fig-panel: #f7f9fb;
      --fig-panel-line: #a8b3bf;
      --fig-blue: #e8f1fb;
      --fig-blue-line: #2563a6;
      --fig-green: #e6f5f0;
      --fig-green-line: #147d64;
      --fig-orange: #fff1e6;
