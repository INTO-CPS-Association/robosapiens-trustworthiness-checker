<svg class="tc-figure" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 355" width="100%" role="img" aria-labelledby="turtlebot-silent-service-trace-title turtlebot-silent-service-trace-desc" style="width:100%; max-width:640px; height:auto;">
  <title id="turtlebot-silent-service-trace-title">Clock-only ticks reveal an overdue request</title>
  <desc id="turtlebot-silent-service-trace-desc">Observation ticks 27 through 29. The service starts at journal time 2.2 seconds on tick 27. No further journal records arrive; clock samples at 4 and 5 seconds, released after that record, create ticks 28 and 29. Request age increases from 0 to 1.8 and 2.8 seconds. The request remains pending, apply_spin_on_time changes from true to false, and no end of the request is observed. Equal tick spacing does not imply equal elapsed time.</desc>
  <style>
