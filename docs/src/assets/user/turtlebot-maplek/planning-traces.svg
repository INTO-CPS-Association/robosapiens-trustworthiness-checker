<svg class="tc-figure" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 480" width="100%" role="img" aria-labelledby="turtlebot-planning-traces-title turtlebot-planning-traces-desc" style="width:100%; max-width:660px; height:auto;">
  <title id="turtlebot-planning-traces-title">A fast callback can follow a slow planning response</title>
  <desc id="turtlebot-planning-traces-desc">Two traces share the same journal-time scale. In accepted, planning runs from anomaly at 0.9 seconds to Generated at 1.4, while the Plan callback runs from 1 to 1.4. In slow, planning runs from 0.9 to 4.4, while the callback runs from 4 to 4.4. Dashed marks are deadlines: 2 seconds after anomaly, or 1 second after callback Start. Only the slow planning outcome exceeds its budget.</desc>
