    <rect x="594" y="259" width="92" height="54" rx="5"
          fill="var(--fig-orange)" stroke="var(--fig-orange-line)" stroke-width="1.5" />
    <text x="640" y="281"
          fill="var(--fig-ink)"
          font-family="ui-monospace, monospace"
          font-size="13"
          font-weight="600">d3</text>
    <text x="640" y="299"
