          font-size="11">observed · OLD</text>
    <rect x="314" y="184" width="92" height="54" rx="5"
          fill="var(--fig-blue)" stroke="var(--fig-blue-line)" stroke-width="1.5" />
    <text x="360" y="206"
          fill="var(--fig-ink)"
          font-family="ui-monospace, monospace"
          font-size="13"
          font-weight="600">d1</text>
    <text x="360" y="224"
          fill="var(--fig-ink-2)"
          font-family="system-ui, sans-serif"
          font-size="11">observed · OLD</text>
    <rect x="454" y="259" width="92" height="54" rx="5"
          fill="var(--fig-orange)" stroke="var(--fig-orange-line)" stroke-width="1.5" />
    <text x="500" y="281"
          fill="var(--fig-ink)"
          font-family="ui-monospace, monospace"
          font-size="13"
          font-weight="600">d2</text>
    <text x="500" y="299"
