<svg class="tc-figure" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="100%" role="img" aria-labelledby="reconfiguration-observation-ticks-title reconfiguration-observation-ticks-desc" style="width:100%; max-width:940px; height:auto; background:var(--fig-bg);">
  <title id="reconfiguration-observation-ticks-title">Local control delivery leaves an old-side drain interval</title>
  <desc id="reconfiguration-observation-ticks-desc">Read left to right as one illustrative local observation sequence, not as a global order across independent data and control producers. The old definition is active for observed data ticks d0 and d1. A delivered control item marks a local barrier between d1 and d2. Data d2 and d3 were already admitted and remain on the old side during the old-side drain and local cutover interval. The old definition span ends when the candidate becomes active locally at the second dashed boundary. The first new-definition tick d4 follows that boundary. Dashed vertical guides are physical control and activation boundaries, not logical ticks; the shared baseline marks only the five data positions. The interval is ordered but not an atomic or global cross-owner cutover.</desc>
  <style>
    .tc-figure {
      --fig-bg: #ffffff;
      --fig-edge: #d0d7de;
      --fig-ink: #17212b;
      --fig-ink-2: #52606d;
      --fig-line: #65758b;
      --fig-panel: #f7f9fb;
      --fig-panel-line: #a8b3bf;
      --fig-blue: #e8f1fb;
      --fig-blue-line: #2563a6;
      --fig-green: #e6f5f0;
      --fig-green-line: #147d64;
      --fig-orange: #fff1e6;
      --fig-orange-line: #b54708;
      --fig-purple: #f3ebf8;
      --fig-purple-line: #8055a3;
      --fig-source: #eef6ff;
      --fig-source-line: #3478b8;
      --fig-redis: #fff5e8;
      --fig-redis-line: #bc6b16;
      --fig-checker: #f1ecff;
      --fig-checker-line: #7254b3;
      --fig-knowledge: #eaf8ee;
      --fig-knowledge-line: #39834d;
    }
    @media (prefers-color-scheme: dark) {
      .tc-figure {
        --fig-bg: #171b26;
        --fig-edge: #333a4d;
        --fig-ink: #e6e9f0;
        --fig-ink-2: #a2acbd;
        --fig-line: #8492a6;
        --fig-panel: #1e2432;
        --fig-panel-line: #3d465c;
        --fig-blue: #16283d;
        --fig-blue-line: #6aa9e0;
        --fig-green: #123029;
        --fig-green-line: #4fbfa0;
        --fig-orange: #33240f;
        --fig-orange-line: #e0a44e;
        --fig-purple: #241c33;
        --fig-purple-line: #b18fd4;
        --fig-source: #14283c;
        --fig-source-line: #6fa8db;
        --fig-redis: #33260f;
        --fig-redis-line: #d99a3f;
        --fig-checker: #241d34;
        --fig-checker-line: #a892d6;
        --fig-knowledge: #132c1c;
        --fig-knowledge-line: #5fae74;
      }
    }
  </style>
  <defs>
