  <text x="24" y="30"
        fill="var(--fig-ink)"
        font-family="system-ui, sans-serif"
        font-size="15"
        font-weight="700">Local control delivery leaves an old-side drain interval</text>
  <g fill="none" stroke-linecap="round">
    <line x1="170" y1="62" x2="710" y2="62"
          stroke="var(--fig-blue-line)" stroke-width="3" />
    <line x1="710" y1="62" x2="875" y2="62"
