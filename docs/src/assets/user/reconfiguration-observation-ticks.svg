            orient="auto"
            markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--fig-line)" />
    </marker>
  </defs>
  <rect x="0.75" y="0.75" width="938.5" height="468.5" rx="6"
