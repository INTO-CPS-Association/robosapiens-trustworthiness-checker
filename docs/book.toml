[book]
title = "RoboSAPIENS Trustworthiness Checker"
authors = ["RoboSAPIENS Team"]
language = "en"
src = "src"

[build]
build-dir = "book"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/INTO-CPS-Association/robosapiens-trustworthiness-checker"
# mermaid.min.js and mermaid-init.js are generated by `mdbook-mermaid install docs` and are
# gitignored; the installer also re-adds mermaid-init.js to this list whenever it runs, so the
# entry stays. Its *contents* are ours: `cp theme/mermaid-theme.js mermaid-init.js` after the
# installer replaces the stock initialiser, which themes diagrams with the stock light/dark
# palettes, with the one that reads the figure palette from theme/diagram-theme.css.
additional-js = ["theme/dsrv-highlight.js", "mermaid.min.js", "mermaid-init.js", "theme/diagram-fullscreen.js"]
additional-css = ["theme/diagram-fullscreen.css", "theme/diagram-theme.css"]

# Every Rust example imports `trustworthiness_checker`, which the public playground at
# play.rust-lang.org cannot resolve, so a Run button on any of them can only fail. The
# examples stay highlighted and copyable; they are simply not offered as runnable.
[output.html.playground]
runnable = false

[preprocessor]

[preprocessor.mermaid]
command = "mdbook-mermaid"
