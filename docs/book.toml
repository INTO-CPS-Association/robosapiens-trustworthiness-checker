[book]
title = "RoboSAPIENS Trustworthiness Checker"
authors = ["RoboSAPIENS Team"]
language = "en"
src = "src"

[build]
build-dir = "book"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/INTO-CPS-Association/robosapiens-trustworthiness-checker"
# Mermaid runtime assets are generated locally by `mdbook-mermaid install docs`; the deploy workflow runs it before building.
additional-js = ["theme/dsrv-highlight.js", "mermaid.min.js", "mermaid-init.js", "theme/diagram-fullscreen.js"]
additional-css = ["theme/diagram-fullscreen.css"]

[preprocessor]

[preprocessor.mermaid]
command = "mdbook-mermaid"
