<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 760 360"
     role="img"
     aria-labelledby="replace-slug-title replace-slug-desc"
     style="width:100%; max-width:760px; height:auto;">
  <title id="replace-slug-title">Replace with a concise diagram title</title>
  <desc id="replace-slug-desc">Replace with the reading order, relationships, and line-style meaning.</desc>

  <defs>
    <marker id="replace-slug-arrow"
            markerWidth="7"
            markerHeight="7"
            refX="9"
            refY="5"
            viewBox="0 0 10 10"
            orient="auto"
            markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#65758b" />
    </marker>
  </defs>

  <rect x="0.75" y="0.75" width="758.5" height="358.5" rx="6"
        fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" />

  <text x="28" y="38"
        fill="#17212b"
        font-family="system-ui, sans-serif"
        font-size="15"
        font-weight="700">Replace with diagram title</text>

  <rect x="28" y="82" width="284" height="104" rx="7"
        fill="#e8f1fb" stroke="#2563a6" stroke-width="1.5" />
  <text x="48" y="118"
        fill="#17212b"
        font-family="ui-monospace, monospace"
        font-size="13"
        font-weight="600">source_artifact</text>
  <text x="48" y="145"
        fill="#52606d"
        font-family="system-ui, sans-serif"
        font-size="12">Replace with a concrete role</text>

  <path d="M 312 134 H 444"
        fill="none"
        stroke="#65758b"
        stroke-width="1.8"
        marker-end="url(#replace-slug-arrow)" />
  <text x="378" y="120"
        text-anchor="middle"
        fill="#52606d"
        font-family="system-ui, sans-serif"
        font-size="11">relationship</text>

  <rect x="444" y="82" width="288" height="104" rx="7"
        fill="#e6f5f0" stroke="#147d64" stroke-width="1.5" />
  <text x="464" y="118"
        fill="#17212b"
        font-family="ui-monospace, monospace"
        font-size="13"
        font-weight="600">destination_artifact</text>
  <text x="464" y="145"
        fill="#52606d"
        font-family="system-ui, sans-serif"
        font-size="12">Replace with a concrete role</text>

  <rect x="28" y="232" width="704" height="88" rx="7"
        fill="#f7f9fb" stroke="#a8b3bf" stroke-width="1.5" />
  <text x="48" y="266"
        fill="#17212b"
        font-family="system-ui, sans-serif"
        font-size="14"
        font-weight="600">Replace or remove this semantic group</text>
  <text x="48" y="292"
        fill="#52606d"
        font-family="system-ui, sans-serif"
        font-size="12">Do not use the template layout when another diagram family fits the evidence better.</text>
</svg>
